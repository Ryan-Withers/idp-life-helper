<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDP Life helper</title>
<style>
:root{
  --bg:#faf9f7; --surf:#fff; --surf2:#f4f2ee; --line:#e5e2db; --line2:#d3cfc5;
  --ink:#1a1a18; --dim:#6b6862; --faint:#9a968d;
  --up:#1d8a63; --upbg:#e3f3ec; --dn:#b8402f; --dnbg:#fbe9e6;
  --hot:#b5761a; --hotbg:#fbf1de; --hotline:#e8d09a;
  --qb:#2a6fb5; --rb:#b8593a; --wr:#1d8a63; --te:#6a5cb8; --idp:#a8781f;
  --qbb:#e8f0f9; --rbb:#faece7; --wrb:#e3f3ec; --teb:#eeecfa; --idpb:#faf1de;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14161a; --surf:#1c1f24; --surf2:#22262c; --line:#2c3138; --line2:#3d434b;
  --ink:#e9e7e2; --dim:#9a978f; --faint:#6e6b64;
  --up:#4cc292; --upbg:#16342a; --dn:#e07a63; --dnbg:#361e1a;
  --hot:#e0a33b; --hotbg:#332918; --hotline:#5c4826;
  --qb:#6ba6e0; --rb:#e08a68; --wr:#4cc292; --te:#9b8ee8; --idp:#dbab55;
  --qbb:#1b2836; --rbb:#33221b; --wrb:#16342a; --teb:#252042; --idpb:#332918;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1400px;margin:0 auto;padding:0 18px 60px}

header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0 10px}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--dim);margin-top:2px}
.live{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.st{display:flex;flex-direction:column;gap:1px}
.st .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.st .v{font-size:19px;font-weight:600;line-height:1.15}
.st .v.hot{color:var(--hot)}
.st .v.sm{font-size:13px;font-weight:400}
.dot{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block;margin-right:5px;vertical-align:1px}
.dot.off{background:var(--faint)}
.dot.warn{background:var(--hot)}

button{font:inherit;font-size:12px;background:transparent;color:var(--dim);
  border:1px solid var(--line2);border-radius:6px;padding:4px 11px;cursor:pointer}
button:hover:not(:disabled){color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
button[aria-pressed=true]{background:var(--surf2);color:var(--ink);border-color:var(--faint)}
button.go{border-color:var(--faint);color:var(--ink);font-weight:500;padding:5px 14px}
button.go:hover:not(:disabled){background:var(--surf2)}
button:focus-visible,input:focus-visible{outline:2px solid var(--qb);outline-offset:1px}
.lnk{background:none;border:none;padding:0;font-size:11px;color:var(--faint);text-decoration:underline;cursor:pointer}
.lnk.on{color:var(--ink);font-weight:600}
.lnk:hover{color:var(--dim)}

.banner{background:var(--hotbg);border:1px solid var(--hotline);border-radius:8px;
  padding:10px 13px;margin:14px 0 0;font-size:13px;color:var(--ink);display:flex;gap:9px;align-items:flex-start}
.banner b{font-weight:600}
.banner .ic{color:var(--hot);font-weight:700;flex:none}
.strip{background:var(--surf2);border-radius:8px;padding:11px 13px;margin:12px 0 0}
.strip h3{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.slots{display:flex;flex-wrap:wrap;gap:5px}
.slot{font-size:12px;padding:2px 8px;border-radius:5px;background:var(--surf);border:1px solid var(--line);white-space:nowrap}
.srk{font-size:9px;color:var(--faint);margin-left:4px;vertical-align:1px}
.ledger{margin-top:10px}
.ledger>summary{font-size:11px;color:var(--dim);cursor:pointer}
.ledger .grp2{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  margin:9px 0 4px}
.slot.full{color:var(--up);border-color:transparent;background:var(--upbg)}
.slot.part{color:var(--hot);border-color:transparent;background:var(--hotbg)}
.mine{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.7}
.mine .pk{color:var(--faint);font-size:11px}

.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:10px;margin:14px 0 0}
.rec{background:var(--surf2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column}
.rec h4{margin:0 0 7px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:600}
.rec .who{font-size:19px;font-weight:600;line-height:1.2}
.rec .meta{font-size:12px;color:var(--dim);margin-top:3px}
.rec .nums{display:flex;gap:16px;margin-top:10px}
.rec .num .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.rec .num .v{font-size:17px;font-weight:600;line-height:1.2}
.rec .why{font-size:11px;color:var(--dim);margin-top:auto;padding-top:9px;line-height:1.5}
.rec .why em{font-style:normal;color:var(--ink)}
table.calib{width:auto;margin-top:2px;font-size:12px}
table.calib th{position:static;background:none;border-bottom:1px solid var(--line);padding:3px 12px 3px 0;cursor:default;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
table.calib td{border-bottom:none;padding:3px 12px 3px 0}
table.calib.lg th{cursor:pointer;user-select:none}
table.calib.lg th:hover{color:var(--fg)}
table.calib.lg th.on{color:var(--fg)}
table.calib.lg tr[data-team]{cursor:pointer}
table.calib.lg tr[data-team]:hover td{background:var(--surf2)}
.paths{display:flex;flex-direction:column;gap:3px}
.path{display:flex;align-items:center;gap:7px;font-size:12px;line-height:1.6}
.path .nm2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path .vv{font-weight:600;min-width:38px;text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px;margin:10px 0 0}
.card .v{font-size:16px}
.card{background:var(--surf2);border-radius:8px;padding:8px 12px}
.card .k{font-size:11px;color:var(--dim)}
.card .v{font-size:19px;font-weight:600;line-height:1.25}

.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0;padding:10px 0 8px;
  position:sticky;top:var(--hdr,66px);z-index:25;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .lbl{font-size:12px;color:var(--dim);margin-right:2px}
input[type=search]{font:inherit;font-size:13px;background:var(--surf);color:var(--ink);
  border:1px solid var(--line2);border-radius:6px;padding:5px 10px;min-width:140px}
label.c{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px;cursor:pointer}
/* Hover help. Inverts cleanly in both themes because ink and bg swap.
   Deliberately no position:relative here: the only tipped elements are the
   column headers, which are already sticky and so already a containing block.
   An attribute selector would outrank th{position:sticky} and strand the
   header row in the middle of the table. */
[data-tip]:hover::after,[data-tip]:focus-visible::after{
  content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:0;z-index:60;
  background:var(--ink);color:var(--bg);font-size:11px;font-weight:400;line-height:1.45;
  letter-spacing:0;text-transform:none;text-align:left;padding:6px 9px;border-radius:6px;
  width:max-content;max-width:265px;white-space:normal;pointer-events:none;
  box-shadow:0 4px 14px rgba(0,0,0,.24)}
[data-tip].tr:hover::after,[data-tip].tr:focus-visible::after{left:auto;right:0}
.note{font-size:12px;color:var(--dim);margin:8px 0 10px;max-width:110ch}
.note b{color:var(--ink);font-weight:600}

/* No overflow on .scroll at desktop widths: any non-visible overflow would make
   it the sticky containing block and detach the header row from the viewport.
   Below the breakpoint it becomes a scroll container so the table, rather than
   the whole page, is what slides sideways — sticky is given up there. */
table{width:100%;border-collapse:collapse;font-size:13px}
.scroll table{table-layout:fixed}
th{position:sticky;top:calc(var(--hdr,66px) + var(--barh,40px));background:var(--bg);z-index:20;font-weight:600;font-size:11px;
  letter-spacing:.03em;color:var(--dim);text-align:right;padding:7px 7px;
  border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap}
th.l{text-align:left} th:hover{color:var(--ink)} th[data-on]{color:var(--ink)}
th[data-on]::after{content:"";font-size:9px;margin-left:3px}
td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
td.l{text-align:left}
tbody tr:hover{background:var(--surf)}
tr.gone{opacity:.38}
tr.own{background:var(--upbg)}
tr.own:hover{background:var(--upbg)}
.nm{font-weight:500}
.gl{font-size:10px;color:var(--faint);margin-left:5px;letter-spacing:.05em;text-transform:uppercase}
.gl.you{color:var(--up);font-weight:600}
.thin{color:var(--hot);font-weight:700;cursor:help;margin-left:3px}
.mech{font-size:9px;font-weight:700;letter-spacing:.06em;padding:1px 4px;border-radius:3px;
  margin-left:5px;cursor:help;vertical-align:1px}
.mech.mr{color:var(--rb);background:var(--rbb)}
.mech.mc{color:var(--wr);background:var(--wrb)}
.rk{color:var(--faint);font-size:12px}
.p{display:inline-block;min-width:19px;text-align:center;font-size:11px;font-weight:600;
  padding:1px 5px;border-radius:4px}
.prk{color:var(--faint);font-size:11px;margin-left:4px}
.alt{font-size:10px;font-weight:600;color:var(--idp);margin-left:2px;cursor:help}
.pill{display:inline-block;min-width:30px;text-align:center;font-size:12px;font-weight:500;
  padding:1px 6px;border-radius:4px}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--faint)}
.b{font-weight:600}
.msg{background:var(--surf2);border:1px solid var(--line2);border-radius:8px;
  padding:22px;text-align:center;color:var(--dim);margin:22px 0}
.msg.bad{border-color:var(--dn);color:var(--dn)}
.warn{background:var(--dnbg);border:1px solid var(--dn);color:var(--dn);border-radius:8px;
  padding:9px 13px;font-size:12px;margin:12px 0 0}
details{margin-top:20px;font-size:12px;color:var(--dim)}
summary{cursor:pointer;color:var(--dim);font-weight:600;padding:4px 0;font-size:12px}
#calibwrap,#rosterwrap,#leaguewrap{margin-top:10px}
#league table td,#league table th{padding:3px 8px 3px 0}
#league tbody tr{cursor:pointer}
summary:hover{color:var(--ink)}
details ul{margin:6px 0 0;padding-left:18px} details li{margin:5px 0;max-width:100ch}
/* Player card. Deliberately plain: it exists to show the arithmetic. */
#cardwrap[hidden]{display:none}
#cardbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80}
#card{position:fixed;z-index:81;top:3vh;left:50%;transform:translateX(-50%);
  width:min(720px,94vw);max-height:94vh;overflow:auto;background:var(--surf);
  border:1px solid var(--line2);border-radius:10px;padding:18px 20px}
#card h2{margin:0;font-size:19px}
#card .sub2{color:var(--dim);font-size:12px;margin:2px 0 12px}
#card table{width:100%;font-size:12px;border-collapse:collapse}
#card td,#card th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
#card th{position:static;background:none;font-size:10px;letter-spacing:.05em;color:var(--faint);cursor:default}
#card td.l,#card th.l{text-align:left}
#card tr.tot td{border-top:2px solid var(--line2);border-bottom:none;font-weight:700;padding-top:7px}
#card .grp{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  padding-top:12px;font-weight:700}
#card .why2{font-size:11px;color:var(--dim);line-height:1.6;margin-top:14px;
  border-top:1px solid var(--line);padding-top:10px}
#card code{font-size:11px}
.sq{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.s-sleeper{color:var(--qb)} .bg-sleeper{background:var(--qb)}
.s-shrunk{color:var(--rb)}  .bg-shrunk{background:var(--rb)}
.s-prorated{color:var(--te)} .bg-prorated{background:var(--te)}
.s-rate{color:var(--idp)}   .bg-rate{background:var(--idp)}
#cardclose{float:right;font-size:12px;padding:2px 9px}
tbody tr{cursor:pointer}
footer{font-size:11px;color:var(--faint);margin-top:18px;border-top:1px solid var(--line);padding-top:12px;line-height:1.8}
/* Any panel that can grow wider than the window gets its own sideways scroller.
   Without this the widest table in the page sets the layout viewport, the whole
   document scrolls sideways and the sticky header and filter bar come unstuck
   from the left edge. Harmless when nothing overflows: no scrollbar appears. */
#league,#calib,.strip{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* The board wants about 1250px with every column on, so anything narrower than
   that plus the page gutters has to scroll it rather than the document. The
   breakpoint is set above the measured crossover of 1284 rather than at it,
   because the natural width moves with the longest player name in the feed. Note the
   whole box scrolls, both axes, not just x: overflow-x:auto computes overflow-y
   to auto anyway, and a sticky heading row inside a scroller resolves against
   that scroller. Without a height cap the box grows to fit its own content, so
   the headings never move relative to it and strand mid-table as the page
   scrolls underneath. Capping the height is what makes them stay put. */
@media(max-width:1290px){
  /* contain, so reaching the bottom of the board does not chain into the page
     and drag the whole board up under the sticky header, taking the headings
     with it. A finger on the board moves the board; the page scrolls from
     anywhere else. */
  .scroll{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    max-height:calc(100vh - var(--hdr,66px) - var(--barh,40px) - 16px);
    border-bottom:1px solid var(--line)}
  /* dvh where it exists, because 100vh on a phone measures the viewport with the
     browser chrome collapsed and leaves the last rows under the address bar. */
  @supports(height:100dvh){
    .scroll{max-height:calc(100dvh - var(--hdr,66px) - var(--barh,40px) - 16px)}
  }
  th{top:0}
  /* Every column is on at every width, so the two identity columns pin to the
     left edge. Without the pin you lose track of which row you are on three
     columns in. Column 1 is fixed width so column 2 has an offset to stick to. */
  .scroll th:nth-child(1),.scroll td:nth-child(1){position:sticky;left:0;
    width:34px;min-width:34px;max-width:34px;overflow:hidden}
  .scroll th:nth-child(2),.scroll td:nth-child(2){position:sticky;left:34px}
  /* The corner cells pin on both axes, so they outrank the heading row that
     only pins on one. */
  .scroll th:nth-child(1),.scroll th:nth-child(2){z-index:21}
  /* inherit, not a literal colour, so the drafted and yours row tints carry
     through onto the pinned cells instead of being painted over. */
  .scroll tbody tr{background:var(--bg)}
  .scroll td:nth-child(1),.scroll td:nth-child(2){background:inherit;z-index:2}
}
/* Tighter gutters below 1100 so there is less to scroll through. */
@media(max-width:1100px){td,th{padding-left:5px;padding-right:5px}}
@media(max-width:900px){
  /* Header and filter bar are both sticky, so on a phone they were costing 406
     of 844 points of screen before a single row of the board. Tightened rather
     than removed: nothing here is hidden, it just stops being laid out for a
     desktop. */
  header{padding:8px 0 7px}
  h1{font-size:14px}
  .sub{font-size:11px}
  .top{gap:6px}
  .live{gap:6px 14px}
  .st .v{font-size:16px}
  .st .v.sm{font-size:12px}
  .bar{padding:7px 0 6px;gap:5px}
  input[type=search]{min-width:110px}
  /* Capped only on phones, or the two pinned columns eat 244 of the 354px
     scroller and leave almost nothing to pan the other nineteen through. Long
     names ellipsis and the drafted and yours tags clip off the end, but the row
     tint and the faded drafted row already carry that signal without them. */
  /* Set on the col, not the cell: under table-layout:fixed the colgroup is what
     sizes a column and a max-width on the cell is ignored. */
  /* The Player width is set in JS, not here: table-layout:fixed sizes from the
     colgroup and those widths are inline, which no stylesheet rule can beat. */
}
</style>
</head>
<body>
<header><div class="wrap"><div class="top">
  <div><h1>IDP Life helper</h1><div class="sub" id="lg">loading league…</div></div>
  <div class="live">
    <div class="st"><span class="k">Picks</span><span class="v" id="v-made">—</span></div>
    <div class="st"><span class="k">On clock</span><span class="v sm" id="v-clock">—</span></div>
    <div class="st"><span class="k">Your pick</span><span class="v" id="v-next">—</span></div>
    <div class="st"><span class="k">Away</span><span class="v" id="v-away">—</span></div>
    <div class="st"><span class="k">Feed</span><span class="v sm"><span class="dot off" id="v-dot"></span><span id="v-feed">…</span></span></div>
    <div class="st">
      <span class="k">Data</span>
      <span><button class="go" id="refresh">Refresh</button></span>
    </div>
  </div>
</div></div></header>

<div class="wrap">
  <div id="boot" class="msg">Fetching league, projections and 2025 actuals from Sleeper…</div>
  <div id="stalewarn"></div>

  <div id="app" hidden>
    <div class="recs" id="recs"></div>
    <details id="leaguewrap"><summary>League: how every team is stacking up</summary><div id="league"></div></details>
    <details id="calibwrap"><summary>Cost of waiting, per position</summary><div id="calib"></div></details>
    <div id="qbwarn"></div>
    <details id="rosterwrap" open><summary>Your roster and holes</summary><div class="strip" id="rosterstrip"></div></details>
    <div class="cards" id="cards"></div>

    <div class="bar">
      <span class="lbl">Position</span>
      <button data-f="ALL" aria-pressed="true">All</button>
      <button data-f="QB">QB</button>
      <button data-f="RB">RB</button>
      <button data-f="WR">WR</button>
      <button data-f="TE">TE</button>
      <button data-f="OFF">Offence</button>
      <button data-f="DL">DL</button>
      <button data-f="LB">LB</button>
      <button data-f="DB">DB</button>
      <button data-f="IDP">Defence</button>
      <input type="search" id="q" placeholder="Search" aria-label="Search player">
      <label class="c"><input type="checkbox" id="hide" checked> Hide drafted</label>
      <label class="c"><input type="checkbox" id="yng"> Age &le;26</label>
    </div>

    <p class="note" id="note"></p>

    <div class="scroll">
      <table><colgroup id="cg"></colgroup><thead><tr id="hr"></tr></thead><tbody id="tb"></tbody></table>
    </div>

    <div id="cardwrap" hidden><div id="cardbg"></div><div id="card"></div></div>

    <details id="method">
      <summary>Method, and where the data is thin</summary>
      <ul id="gaps"></ul>
    </details>
    <footer id="ft"></footer>
  </div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------ config */
const LEAGUE = "1352969236586201088";
const MY_SLOT = 11;
const SEASON = 2026, PRIOR = 2025;
/* "week" runs the in-season lineup optimiser off weekly projections and the real
   rosters. "draft" is the board this started as, kept because the engine under
   both is identical and only the inputs differ: same scoring, same backfill,
   same replacement levels, same optimal assignment. Flipping it back is one
   click in the footer rather than a different page. */
let MODE = localStorage.getItem("idp_mode") === "draft" ? "draft" : "week";
const isWeek = () => MODE === "week";
const POLL_MS = 45000;
const SURV_SD = 8;                 // measured spread of this room vs ADP
const PLAYER_CACHE_KEY = "idp_players_v6";   // v6: injury status and depth chart join the cached record
const PLAYER_CACHE_MS = 864e5;     // 24h

/* Standard full PPR, the comparison rulebook. Same stat line, different table. */
const PPR = {pass_yd:.04, pass_td:4, pass_int:-2, pass_2pt:2, rush_yd:.1, rush_td:6,
             rush_2pt:2, rec:1, rec_yd:.1, rec_td:6, rec_2pt:2, fum_lost:-2};

const OFF = ["QB","RB","WR","TE"], DEF = ["DL","LB","DB"];
const PC = {QB:["var(--qb)","var(--qbb)"], RB:["var(--rb)","var(--rbb)"],
            WR:["var(--wr)","var(--wrb)"], TE:["var(--te)","var(--teb)"],
            DL:["var(--idp)","var(--idpb)"], LB:["var(--idp)","var(--idpb)"],
            DB:["var(--idp)","var(--idpb)"]};

/* Which positions each flex slot can take. */
const FLEX_TAKES = {FLEX:["RB","WR","TE"], WRRB_FLEX:["RB","WR"], "WRRB-FLEX":["RB","WR"],
                    REC_FLEX:["WR","TE"], SUPER_FLEX:["QB","RB","WR","TE"],
                    IDP_FLEX:["DL","LB","DB"]};
const BENCH = new Set(["BN","IR","TAXI"]);
/* Two different sample denominators, because these stats accumulate differently.
   A defensive back's pass defended count scales with coverage opportunity, which
   tackles proxy for. A pass rusher's TFL and QB hits scale with snaps, not with
   tackles: Myles Garrett had 60 tackles but 33 TFL and 39 QB hits over a full
   season. Shrinking those by tackle count pulled every elite rusher halfway to
   the positional mean on a complete sample, which is exactly backwards. */
const BACKFILL_PER_TACKLE = ["idp_pass_def"];
const BACKFILL_PER_GAME   = ["idp_tkl_loss","idp_qb_hit"];
const BACKFILL_RATE = BACKFILL_PER_TACKLE.concat(BACKFILL_PER_GAME);
const SLOT_LABEL = {SUPER_FLEX:"SF", IDP_FLEX:"IDP FLEX", WRRB_FLEX:"WR/RB", REC_FLEX:"REC"};
/* Short header for the league table, where every slot type gets its own column. */
const COLW = {"wrk": 34, "st": 74, "iadp": 34, "n": 196, "p": 78, "t": 46, "a": 40, "adp": 54, "cadp": 64, "app": 50, "hid": 58, "ppr": 50, "o": 52, "a25": 52, "now": 50, "v": 54, "f": 48, "pm": 52, "om": 50, "b": 54, "rel": 58, "s1": 54, "s2": 54, "es": 54};
const SLOT_COL = {FLEX:"FLX", SUPER_FLEX:"SFLX", IDP_FLEX:"IDP",
                  WRRB_FLEX:"WR/RB", "WRRB-FLEX":"WR/RB", REC_FLEX:"REC"};

/* Dynasty weighting for Our BPA. Deliberately almost empty.
   No positional tilt: VORP is already points per game under this league's
   scoring minus a position-specific replacement level, so the format effect
   and positional scarcity are both inside it. A pos multiplier on top would
   count the rulebook twice.
   No roster-need or strike-timing terms: roster context is stated in the box,
   never scored, and the three-QB requirement is served by the amber prompt.
   Age applies only where the market gives no signal. Fut is the market pricing
   remaining career while controlling for current production, which beats a
   linear curve off a birth date, so stacking both would compound one variable.
   But Fut is null for every defender, since no dynasty IDP values are published
   anywhere, so the age curve fills that hole and only that hole. */
const RULES = {
  ageMid: 26,                 // neutral age, younger scores up
  agePer: 0.030,              // per year either side
  ageMin: 0.85, ageMax: 1.28,
  /* YOUR INPUT, not a measurement. Sleeper's adp_idp comes from leagues that
     start two or three defenders, so it is the wrong anchor for one that
     starts nine, and it is noisy besides (Campbell 194.8 against Dean 414,
     which matches no value order). Defensive ADP is therefore rebuilt from
     our own value ranking, anchored on where you read this room taking the
     first defender. 95 is where the analysis landed: the pick at which the best
     linebacker becomes worth more than the best offensive player left. */
  idpFirstPick: 95,
  /* Empirical Bayes shrinkage on the per-tackle rates. A rate off 55 tackles is
     mostly noise; off 150 it is mostly signal. w = tackles / (tackles + k), so
     k is the sample size at which a player's own rate and his positional mean
     carry equal weight. 60 is a prior, not a fit: tuning it properly needs 2025
     split into halves, and Sleeper's season endpoint serves totals only, so the
     split would cost 18 weekly pulls on every page load. Stated on the page. */
  shrinkK: 60,
  /* Games at which a player's own TFL / QB-hit rate and his positional mean
     carry equal weight. A full 17-game season lands at w = 0.68. */
  shrinkKGames: 8
};
/* Apply a dynasty weight without destroying the ordering below replacement.
   Multiplying a negative by a bonus makes it less negative, i.e. better, which
   is backwards. Clamping at zero was worse: it tied every sub-replacement
   player at exactly 0 and scattered them arbitrarily, which is how a rookie
   quarterback stash ended up past iADP 300. Dividing keeps the sign, keeps the
   direction (runway makes a negative less bad) and keeps every player ordered. */
const weight = (v, m) => m <= 0 ? v : (v > 0 ? v * m : v / m);
const ageMult = a => {
  const age = a == null ? RULES.ageMid : a;
  return Math.min(RULES.ageMax, Math.max(RULES.ageMin,
    1 + RULES.agePer * (RULES.ageMid - age)));
};

             order:{}, names:{}};

/* How many rows get painted. null is the draft-sized default and -1 is all of
   them; anything else is that number. Only ever limits what is DRAWN: filtering,

const $ = i => document.getElementById(i);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function jget(url, opts){
  const r = await fetch(url, Object.assign({cache:"no-store"}, opts||{}));
  if(!r.ok) throw new Error(url.split("/").slice(-1)[0].split("?")[0] + " HTTP " + r.status);

/* ------------------------------------------------------------------- maths */
function median(xs){
  if(!xs.length) return null;
  const a = xs.slice().sort((x,y) => x-y), m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
}

/* Normal CDF, Abramowitz & Stegun 26.2.17. Good to ~7.5e-8. */
function normCdf(z){
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989422804014327 * Math.exp(-z * z / 2);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 +
            t * (-1.821255978 + t * 1.330274429))));
  return z > 0 ? 1 - p : p;
}

/* ----------------------------------------------------------------- scoring */
/* Apply a scoring table to a stat line. Two keys need special handling:
   pass_inc has no stat field, and bonus_rec_te only applies to tight ends. */
function score(s, position, table){
  let t = 0;
  for(const k in table){
    const m = table[k];
    if(!m) continue;
    if(k === "pass_inc"){ t += m * Math.max(0, (s.pass_att||0) - (s.pass_cmp||0)); continue; }
    if(k === "bonus_rec_te"){ if(position === "TE") t += m * (s.rec||0); continue; }
    if(s[k]) t += m * s[k];
  }
  return t;
}

/* --------------------------------------------------------- lineup / slots */
/* Read the real lineup out of roster_positions rather than assuming it. */
function slotCounts(rosterPositions){
  const c = {};
  for(const raw of (rosterPositions||[])){
    const p = String(raw).toUpperCase();
    if(BENCH.has(p)) continue;
    c[p] = (c[p]||0) + 1;
  }
  return c;
}

/* Greedy flex fill on current projections. Never hardcoded: fill the dedicated
   slots, then hand each flex slot to whichever eligible position has the best
   player left. Replacement is the next man after the ones consumed. */
function replacement(rows, slots, teams, key){
  const K = key || "o";
  const pool = {}, idx = {};
  for(const b of OFF.concat(DEF)){
    /* Partial-season projections are draftable but not startable, so they are on
       the board and out of this fill. A four-game projection at a high per-game
       rate would otherwise set replacement for his position and quietly move
       every VORP on the board. */
    pool[b] = rows.filter(r => r.p === b && r[K] != null && r.full !== false)
                  .sort((x,y) => y[K] - x[K]);
    idx[b] = (slots[b]||0) * teams;
  }
  const nextVal = b => idx[b] < pool[b].length ? pool[b][idx[b]][K] : -Infinity;
  for(const [slot, takes] of Object.entries(FLEX_TAKES)){
    const n = (slots[slot]||0) * teams;
    for(let i = 0; i < n; i++){
      let best = null;
      for(const b of takes) if(best === null || nextVal(b) > nextVal(best)) best = b;
      if(best !== null && nextVal(best) > -Infinity) idx[best]++;
    }
  }
  const R = {}, starts = {}, dry = [];
  for(const b of OFF.concat(DEF)){
    starts[b] = idx[b];
    R[b] = pool[b].length ? +pool[b][Math.min(idx[b], pool[b].length - 1)][K].toFixed(1) : 0;
    /* Every startable player got consumed, so this is a floor rather than a real
       replacement level and VORP at that position reads high. Cannot happen on
       live data, but a silent wrong number here would poison the whole board. */
    if(idx[b] >= pool[b].length) dry.push(b);
  }
  return [R, starts, dry];
}

/* --------------------------------------------------------- draft geometry */
/* Round 1 runs forward. Snake flips each round, and the reversal round repeats
   the prior round's direction, flipping every round from there on. */
function isForward(round, reversal){
  return (round % 2 === 1) !== (reversal > 0 && round >= reversal);
}
function pickNo(round, slot, teams, reversal){
  return (round - 1) * teams + (isForward(round, reversal) ? slot : teams - slot + 1);
}
function slotForPick(n, teams, reversal){
  const round = Math.floor((n - 1) / teams) + 1, i = (n - 1) % teams + 1;
  return isForward(round, reversal) ? i : teams - i + 1;
}

/* Who owns every pick in the draft, honouring trades.

   A pick has two different identities and conflating them is the classic way to
   get a traded draft wrong. draft_slot is the SEAT: which chair the pick is made
   from, fixed by the draft order and never moved by a trade. roster_id is the
   TEAM that owns the pick and gets the player. Trading a pick moves the second
   and not the first, so reading ownership off the seat credits every traded pick
   to the manager who sold it.

   This returns pick number -> owning roster_id for the whole draft, which is the
   one source of truth for whose picks are whose, who is on the clock, and which
   of your future picks still exist. */
/* Sleeper is not consistent about the type of a roster id: slot_to_roster_id and
   traded_picks carry numbers, a pick object carries the same id as a string. One
   strict comparison against the wrong type and every pick looks like somebody
   else's, so everything is normalised on the way in. */
const asRid = v => (v == null || v === "" || isNaN(+v)) ? null : +v;

function buildOwners(d, tradedPicks){
  const slotOf = {}, rosterIds = [];
  for(const [s, raw] of Object.entries(d.slots||{})){
    const rid = asRid(raw);
    if(rid == null) continue;
    slotOf[rid] = +s; rosterIds.push(rid);
  }
  const owner = new Map();
  if(!rosterIds.length) return {owner, slotOf};
  /* Sleeper keys a traded pick by the roster it ORIGINATED from, never by the
     seat and never by the current holder, so round plus original roster is the
     stable identity of a pick through any number of trades. */
  const rows = new Map();
  for(const t of (tradedPicks||[])){
    if(d.season && t.season && String(t.season) !== String(d.season)) continue;
    const from = asRid(t.roster_id), to = asRid(t.owner_id);
    if(from == null || to == null) continue;
    const k = t.round + ":" + from;
    if(!rows.has(k)) rows.set(k, []);
    rows.get(k).push({from, to, prev: asRid(t.previous_owner_id)});
  }
  for(let r = 1; r <= d.rounds; r++)
    for(const rid of rosterIds){
      const seat = slotOf[rid];
      if(!seat) continue;
      owner.set(pickNo(r, seat, d.teams, d.reversal),
                resolveOwner(rows.get(r + ":" + rid), rid));
    }
  return {owner, slotOf};
}

/* A pick can change hands more than once, and the feed does not promise to hand
   the hops back in order. Walking previous_owner -> owner from the roster the
   pick came from resolves a chain of any length regardless of array order. If
   nothing chains off the origin the feed is reporting current state with an
   intermediate previous owner, so fall back to the terminal owner: the one who
   is nobody else's previous owner. Both readings land on the same answer for the
   ordinary single-hop case. */
function resolveOwner(rows, origin){
  if(!rows || !rows.length) return origin;
  /* Each row is one hop and is consumed at most once. Guarding on the row rather
     than on the owner is what lets a pick be traded away and traded back: an
     owner-based guard refuses the return hop and strands the pick with whoever
     held it in the middle. Consuming rows still terminates, because every step
     removes one. */
  const used = new Set();
  let cur = origin, hops = 0;
  for(;;){
    const i = rows.findIndex((x, j) => !used.has(j) && x.prev === cur);
    if(i < 0) break;
    used.add(i); cur = rows[i].to; hops++;
  }
  /* At least one hop means the walk is authoritative, even when it lands back
     where it started. No hops means nothing chained off the origin, so the feed
     is reporting current state with an intermediate previous owner: fall back to
     the terminal owner, the one who is nobody else's previous owner. */
  if(hops) return cur;
  const prev = new Set(rows.map(x => x.prev));
  const term = [...new Set(rows.map(x => x.to))].filter(o => !prev.has(o));
  return term.length === 1 ? term[0] : rows[rows.length - 1].to;
}

/* Falls back to the raw snake formula when the draft endpoint is unavailable,
   which is the only case where trades cannot be honoured. */
function myPicksFrom(d, mySlot){
  const myRid = asRid((d.slots||{})[String(mySlot)]);
  if(myRid == null || !d.owner || !d.owner.size){
    const out = [];
    for(let r = 1; r <= d.rounds; r++) out.push(pickNo(r, mySlot, d.teams, d.reversal));
    return [out, null];
  }
  const out = [];
  for(const [n, rid] of d.owner) if(rid === myRid) out.push(n);
  out.sort((a,b) => a - b);
  return [out, myRid];
}

/* Which team a made pick actually belongs to. The pick's own roster_id is
   authoritative because the trade has already resolved by the time it is made;
   picked_by and the ownership map are fallbacks for drafts that do not carry
   one, and the seat is the last resort. */
function ownerOf(p){
  const direct = asRid(p.roster_id);
  if(direct != null) return direct;
  if(p.picked_by && draft.userRoster[p.picked_by] != null) return draft.userRoster[p.picked_by];
  const byMap = draft.owner && draft.owner.get(p.pick_no);
  if(byMap != null) return byMap;
  return asRid((draft.slots||{})[String(p.draft_slot)]);
}
const slotOfRoster = rid => (rid != null && draft.slotOf[rid]) || null;
/* One definition of "mine", by roster rather than by seat, so a pick I traded
   away is not mine and a pick I traded for is. */
const isMine = t => t && (MY_ROSTER_ID != null ? t.rid === MY_ROSTER_ID : t.slot === MY_SLOT);

/* ---------------------------------------------------------------- survival */
/* This room reaches for youth, not for position. Age leads because the age
   bands rest on a far larger sample than the rookie experience figure, which
   came off roughly three players. Effect size is worthless without an n, so the
   bigger measured effect does not get to drive this. Experience is the fallback
   only when age is missing. The two are never added: a rookie is already young,
   so counting both would double the same signal. */
function reachFor(exp, age){
  if(age != null) return age <= 24 ? 7.8 : age <= 27 ? -0.7 : -2.9;
  if(exp != null) return exp <= 1 ? 17.9 : exp <= 3 ? 1.8 : -1.3;
  return 0;
}
/* P(draft position >= pick), i.e. still on the board when that pick comes up. */
function pAlive(adp, reach, pick){
  return 1 - normCdf((pick - (adp - reach)) / SURV_SD);
}
/* Conditioned on the player still being available right now. */
function survival(adp, reach, pick, current){
  if(adp == null || pick == null) return null;
  const now = pAlive(adp, reach, current);
  if(!(now > 1e-6)) return 1;      // already slid well past ADP and still here
  return Math.max(0, Math.min(1, pAlive(adp, reach, pick) / now));
}

/* ------------------------------------------------------------- cost of waiting */
/* VORP measures value against a freely available player. That is the wrong
   baseline in a 45 round draft with 26 bench spots: with 390 defenders clearing
   the floor for 108 starting slots you are never actually forced down to the
   45th linebacker. What a pick really costs you is the gap between this player
   and the best one at his position still on the board when you next choose.

   Expected best survivor, walking the position from the top: each player is the
   best available only if he survives and everyone better does not. Falls back to
   replacement in the tail where nobody survives. */
/* For a pool sorted best first, fallback[i] is the expected best player still
   there at your next pick from position i onward. Backward recurrence: the man
   at i is the best if he survives, otherwise you fall through to the rest.
      E[i] = o[i]*s[i] + (1 - s[i]) * E[i+1],  E[end] = replacement
   Each player is then measured against fallback[i+1], the best you could get at
   his position later having passed on him and everyone above him. Measuring
   against the whole pool instead would let a flat position cluster near zero
   and float to the top of the board, which is the opposite of the truth. */
function fallbacks(pool, repl){
  const e = new Array(pool.length + 1);
  e[pool.length] = repl;
  for(let i = pool.length - 1; i >= 0; i--){
    const s = pool[i].s1 == null ? 0 : pool[i].s1;
    e[i] = pool[i].o * s + (1 - s) * e[i + 1];
  }
  return e;
}

/* Attach "what taking him now gains you over waiting" to every live player.
   Steep positions score high because the fall is real. Flat, deep positions
   score near zero because the room hands you a near identical player later,
   which is what pushes defence down the board without any invented constant. */
function costOfWaiting(){
  const p1 = futurePicks().p1;
  /* No next pick means waiting is not an option, so there is nothing to measure
     against. Rather than let every drop-off silently collapse to zero on the
     final pick, the column is withdrawn and the board falls back to VORP, which
     is the correct question when this is the last selection you make. */
  if(!p1 || !META.R){ ROWS.forEach(r => r.now = null); return {mode:"none", p1:null, calib:[]}; }
  const calib = [];
  for(const b of OFF.concat(DEF)){
    const pool = ROWS.filter(r => r.p === b && !taken.has(r.id)).sort((x,y) => y.o - x.o);
    if(!pool.length) continue;
    const e = fallbacks(pool, META.R[b]);
    /* Two ceilings, take the lower. A pick cannot be worth more than the player
       is over a freely available one (VORP), nor more than you forfeit by not
       taking him now (the fallback gap). Without the VORP ceiling anyone sitting
       above a cliff scores high no matter how ordinary he is: the 35th
       quarterback tops the board purely because the 36th is dreadful. Without
       the fallback ceiling you are back to VORP and defence floats. */
    /* Waiting on a player only costs you anything in the branch where he is
       gone. With probability s he is still sitting there and you lose nothing,
       so the honest expected cost is (1 - s) x gap, not the gap itself. That
       is why a linebacker certain to last now reads zero however large the gap
       to the next man is. The VORP cap stays as a ceiling: a pick cannot be
       worth more than the player is over a freely available one, which stops
       anyone perched above a cliff scoring high on nothing but the fall. */
    pool.forEach((r,i) => {
      const gap = Math.min(r.v, r.o - e[i + 1]);
      r.now = +(r.s1 == null ? gap : (1 - r.s1) * gap).toFixed(2);
    });
    calib.push({p:b, best:pool[0], later:+e[1].toFixed(1),
                loss:+(pool[0].o - e[1]).toFixed(1), depth:pool.length});
  }
  ROWS.forEach(r => { if(taken.has(r.id)) r.now = null; });

  /* The board order. Everyone is measured the same way: against the best you
     could actually get at that position instead, never against a free player
     you will not be forced down to. Ties, which are common because anyone
     certain to survive scores exactly zero, fall back to ADP. Among players you
     can equally wait on, the one the room takes soonest leads and the one it
     ignores until round 18 sinks, which is where a linebacker belongs. */
  ROWS.filter(r => r.now != null)
      .sort((a,b) => (b.now - a.now) || ((a.adp == null ? 9999 : a.adp) - (b.adp == null ? 9999 : b.adp)))
      .forEach((r,i) => r.nrk = i + 1);
  ROWS.forEach(r => { if(r.now == null) r.nrk = null; });
  return {mode:"live", p1, calib};
}

/* --------------------------------------------------------------- my roster */
/* Fill my own players into the 19 starting slots so the holes that show are real
   holes. Runs the same optimal assignment the league view uses, rather than a
   second greedy pass of its own: two different fills on one page would sooner or
   later disagree about how many slots the same roster covers. */
function rosterFill(mine, slots){
  /* Coverage, not choice. This strip answers "do I own a body here", so it
     always fills slots first, in both modes. Passing the week objective made it
     answer "is he worth starting instead", and a WR3 who projects under
     replacement read as a missing receiver: same number, two different
     questions, and the wrong one on screen. Lineup choice lives in the
     start/sit boxes, which use the other objective on purpose. */
  const {lineup} = lineupFor(mine, slots, META.R || {}, "o", true);
  const out = [], at = {};
  for(const x of lineup){
    if(at[x.slot] == null){ at[x.slot] = out.length; out.push({slot:x.slot, need:0, got:0}); }
    const e = out[at[x.slot]];
    e.need++;
    if(x.r) e.got++;
  }
  return out;
}

/* Positional per-tackle rates for the three stats Sleeper never projects,
   pooled across everyone with a real 2025 sample. These are what a thin sample
   gets pulled toward. Kept separate per position because a corner's pass
   defended rate per tackle is nothing like a linebacker's. */
function leagueRates(P, prior){
  const acc = {}, out = {};
  for(const b of DEF) acc[b] = {tkl:0, gm:0, idp_pass_def:0, idp_tkl_loss:0, idp_qb_hit:0};
  for(const id in prior){
    const meta = P[id]; if(!meta) continue;
    const b = meta[1]; if(!DEF.includes(b)) continue;
    const ac = prior[id];
    if((ac.gp || 0) < 8) continue;
    const tkl = (ac.idp_tkl_solo || 0) + (ac.idp_tkl_ast || 0);
    if(tkl <= 0) continue;
    acc[b].tkl += tkl; acc[b].gm += ac.gp || 0;
    for(const k of BACKFILL_RATE) acc[b][k] += ac[k] || 0;
  }
  for(const b of DEF){
    out[b] = {};
    for(const k of BACKFILL_PER_TACKLE) out[b][k] = acc[b].tkl > 0 ? acc[b][k] / acc[b].tkl : 0;
    for(const k of BACKFILL_PER_GAME)   out[b][k] = acc[b].gm  > 0 ? acc[b][k] / acc[b].gm  : 0;
  }
  return out;
}

/* ------------------------------------------------------------------ build */
/* Score every player, twice, on the identical stat line. */
/* What the pool discarded and why, so "we are missing some" is answerable from
   the page instead of from the source. */
let DROP = {gp:0, meta:0};
let PLAYER_SEEN = 0;
function buildRows(P, proj, prior, scoring, future){
  const out = [];
  DROP = {gp:0, meta:0};
  const LR = leagueRates(P, prior);
  /* In week mode the pool is every projected player PLUS everyone rostered in
     the league, because a player Sleeper does not project this week is exactly
     the one you need to see: he is on a bye or he is out, and a lineup optimiser
     that silently drops him would quietly start someone who is not playing. */
  const ids = new Set(Object.keys(proj));
  if(isWeek()) for(const id of ROSTERED) ids.add(id);
  for(const id of ids){
    const meta = P[id]; if(!meta){ DROP.meta++; continue; }
    const pj = proj[id] || {};
    const noproj = !proj[id];
    const [nm, b, tm, age, exp, elig] = meta;
    /* A positive denominator is all that is genuinely required, because every
       number on this board is per game. The old floor of 12 threw away exactly
       the players a 50-round draft is for: anyone suspended, anyone coming back
       from a season-ending injury, anyone Sleeper expects to play a partial
       year. In a 600-pick draft those are picks, not noise. */
    /* One number, two meanings, and getting it wrong is the whole ballgame. In
       season mode a projection covers pj.gp games and every figure on the board
       is that total divided by them, so gp is the denominator. In week mode a
       projection IS one game, so the denominator is 1 and the number on screen
       is the points he scores this week rather than his rate. Everything
       downstream divides by gms, so both modes fall out of the same code. */
    const gp = isWeek() ? 1 : (pj.gp || 0);
    if(!isWeek() && gp < 1){ DROP.gp++; continue; }
    /* Season mode only: a short projection is not startable for a full year, so
       it is flagged and kept out of the replacement fill. A week is a week. */
    const full = isWeek() ? true : gp >= 12;
    const onBye = isWeek() && tm && BYE.has(tm);

    const s = Object.assign({}, pj);
    const ac = prior[id] || {}, ag = ac.gp || 0;
    let w = null, rates = null;      // shrinkage weight and the rates behind it
    /* Which stats Sleeper actually projected, and which we filled in. The card
       colours by this, so nothing we invented can pass itself off as a feed. */
    const src = {};
    for(const k in pj) if(typeof pj[k] === "number") src[k] = "sleeper";

    /* Backfill what Sleeper omits, from the player's own 2025 rate. Never a
       league average — a missing field is a gap in the payload, not a player
       who does not do that thing. */
    /* No projection this week means no points, full stop. Backfilling him would
       prorate his 2025 rates onto a game he is not playing and hand a player on
       bye a score, which is precisely the mistake a lineup optimiser must not
       make. Season mode never reaches this branch, because a row without a
       projection does not exist there. */
    if(ag >= 6 && !noproj){
      if(OFF.includes(b)){
        for(const k of ["pass_att","pass_cmp","pass_td","pass_yd","pass_int","rush_td",
                        "pass_cmp_40p","rush_40p","rec_40p"])
          if(!(k in s) && k in ac){ s[k] = ac[k] / ag * gp; src[k] = "prorated"; }
      }else{
        /* Sleeper never projects pass defended, TFL or QB hits. Pass defended is
           3 points and a large share of DB scoring, so this matters. Scale them
           off the player's own 2025 per-tackle rate. */
        const base = Math.max(1, (ac.idp_tkl_solo||0) + (ac.idp_tkl_ast||0));
        const pt = Math.max(1, (pj.idp_tkl_solo||0) + (pj.idp_tkl_ast||0));
        /* Shrink each rate toward its positional mean in proportion to sample
           size, so one loud season off 55 tackles cannot carry a ranking. */
        rates = {n:Math.round(base), g:ag, w:{}, raw:{}, lg:{}, per:{}};
        /* Pass defended shrinks on tackle count and projects off tackles. */
        for(const k of BACKFILL_PER_TACKLE){
          const wk = base / (base + RULES.shrinkK);
          const own = (ac[k] || 0) / base, lg = (LR[b] || {})[k] || 0;
          rates.w[k] = +wk.toFixed(3); rates.raw[k] = +own.toFixed(4);
          rates.lg[k] = +lg.toFixed(4); rates.per[k] = "tackle";
          s[k] = (wk * own + (1 - wk) * lg) * pt;
          src[k] = "shrunk";
        }
        /* TFL and QB hits shrink on games and project off games, because they
           track snaps rather than tackle volume. */
        for(const k of BACKFILL_PER_GAME){
          const wk = ag / (ag + RULES.shrinkKGames);
          const own = (ac[k] || 0) / ag, lg = (LR[b] || {})[k] || 0;
          rates.w[k] = +wk.toFixed(3); rates.raw[k] = +own.toFixed(4);
          rates.lg[k] = +lg.toFixed(4); rates.per[k] = "game";
          s[k] = (wk * own + (1 - wk) * lg) * gp;
          src[k] = "shrunk";
        }
        w = rates.w.idp_pass_def;
        for(const k of ["idp_int_ret_yd","idp_fum_ret_yd"]){ s[k] = (ac[k]||0) / base * pt; src[k] = "rate"; }
        for(const k of ["st_tkl_solo","st_ff","st_fum_rec"]){ s[k] = (ac[k]||0) / ag * gp; src[k] = "prorated"; }
      }
      /* Return yards are never projected for anyone. Prorate from 2025 and let
         the scoring table price them, so the league's own rate is used once. */
      for(const k of ["kr_yd","pr_yd"]){ s[k] = (ac[k]||0) / ag * gp; src[k] = "prorated"; }
    }

    const o = score(s, b, scoring) / gp;
    /* No scoring floor. Anyone Sleeper projects at all is on the board, because
       in a 600-pick draft the back of the pool is picks rather than clutter and
       a floor is the tool deciding for you what is undraftable. Sort and filter
       decide what you look at; this decides only what exists. */
    const isOff = OFF.includes(b);
    /* The same league scoring on the RAW payload, nothing backfilled. This is the
       number the rest of the room is looking at, for every position rather than
       just defence, which is what the league view compares against. Kept separate
       from app: app is the defence-only display column with its own guards, and
       widening it would change columns that are already verified. */
    const sleep = +(score(pj, b, scoring) / gp).toFixed(2);

    /* How much of a defender's score rests on stats Sleeper never projects and
       we inferred from his 2025 per-tackle rate. This is model risk, not
       measurement, and it is very unevenly spread across the three positions. */
    let bf = null, app = null, hid = null, hidPct = null, mech = null;
    if(!isOff){
      /* What every other manager sees. The raw Sleeper payload scored under the
         league rules with no backfill whatsoever, because Sleeper's projection
         simply has no idp_pass_def, idp_tkl_loss or idp_qb_hit fields. */
      app = +(score(pj, b, scoring) / gp).toFixed(2);
      /* What those three missing stats are actually worth, at 3, 2 and 1 point. */
      /* Only estimable with a 2025 sample to scale from. Without one, hidden is
         unknown rather than zero: reporting zero would show a rookie as having
         no invisible value and drop him dozens of places against peers who
         merely have data. */
      /* Hidden is everything the app cannot see, not just the three headline
         stats. Sleeper also projects no special teams tackles, no kick or punt
         return yards and no interception or fumble return yards. Taking the
         whole difference guarantees App + Hidden = Ours, which the three-stat
         version did not: it left a third of the real edge unaccounted for. */
      const missing = ag >= 6
        ? {idp_pass_def:s.idp_pass_def || 0, idp_tkl_loss:s.idp_tkl_loss || 0,
           idp_qb_hit:s.idp_qb_hit || 0} : null;
      hid = missing ? +(+o.toFixed(1) - app).toFixed(2) : null;   // against the displayed Ours, so the identity holds on screen
      const trueScore = missing ? app + hid : null;
      if(missing){
        hidPct = trueScore > 0 ? Math.round(100 * hid / trueScore) : null;
        if(o > 0) bf = +Math.max(0, hid / o).toFixed(3);
      /* Which mechanism is doing the hiding. Edge rushers are buried by QB hits
         and TFL, corners by pass defended. */
        const rush = (missing.idp_qb_hit * (scoring.idp_qb_hit || 0)) +
                     (missing.idp_tkl_loss * (scoring.idp_tkl_loss || 0));
        const cov = missing.idp_pass_def * (scoring.idp_pass_def || 0);
        if(hid > 0.3) mech = rush > cov * 1.3 ? "RUSH" : cov > rush * 1.3 ? "COV" : "BOTH";
      }
    }

    out.push({
      id, n:nm, p:b, t:tm || "FA", a:age, exp, elig: elig || [b],
      adp: pickAdp(pj, isOff),
      o: +o.toFixed(1),
      s: isOff ? +(score(s, b, PPR) / gp).toFixed(1) : null,
      /* Display only, deliberately kept out of s. Offence gets standard full PPR
         on the same stat line. Defenders have no PPR categories at all, so the
         comparable figure is the one Sleeper itself publishes under its own
         default IDP scoring. Keeping it separate matters: s gates the rules edge
         and the league median, and letting defenders into either would corrupt
         both. */
      ppr: isOff ? +(score(s, b, PPR) / gp).toFixed(1)
                 : (pj.pts_ppr != null && gp ? +(pj.pts_ppr / gp).toFixed(1) : null),
      a25: ag >= 6 ? +(score(ac, b, scoring) / ag).toFixed(1) : null,
      g25: ag,
      thin: !isOff && ag > 0 && ag < 8,     // 2025 sample too short to trust the backfill
      full, gp12:gp, noproj, onBye,
      inj: meta[6] || null, depth: meta[7] != null ? meta[7] : null,
      bf, app, hid, hidPct, mech, shrinkW:w, rates, sleep,
      line:s, src, gp, ag,
      f: future[id] != null ? future[id] : null,
      es: null,
      reach: reachFor(exp, age)
    });
  }
  return out;
}

/* Sleeper publishes no dynasty superflex ADP for defenders, so they fall back
   to adp_idp. Without it the whole defensive board would have no survival read. */
function pickAdp(pj, isOff){
  const a = isOff ? pj.adp_dynasty_2qb : (pj.adp_idp != null ? pj.adp_idp : pj.adp_dynasty_2qb);
  return (a != null && a > 0 && a < 999) ? +a.toFixed(1) : null;
}

/* VORP, the rules edge, and both rank movements. */
function analyse(rows, slots, teams){
  const [R, starts, dry] = replacement(rows, slots, teams);
  /* The same greedy fill run on Sleeper's own numbers, so the league view's
     Sleeper column fills an empty slot at the replacement level that view would
     see rather than borrowing ours. */
  const [Rsleep] = replacement(rows, slots, teams, "sleep");
  rows.forEach(r => r.v = +(r.o - R[r.p]).toFixed(2));

  /* The league inflates everyone by about 60%, so the raw boost is meaningless
     in isolation. Only the deviation from the median says who the rulebook
     actually favours. */
  const med = median(rows.filter(r => r.s > 3).map(r => r.o / r.s));
  /* Defenders have no PPR baseline, so Boost and vs med would be blank for half
     the board. The better baseline for them is what the Sleeper app shows: the
     same two columns carry hidden value instead, measured against the median
     for their own position because the three differ enormously. */
  const hidMed = {};
  for(const b2 of DEF){
    const v = rows.filter(r => r.p === b2 && r.hidPct != null).map(r => r.hidPct);
    hidMed[b2] = median(v);
  }
  rows.forEach(r => {
    if(r.s > 3 && med){
      r.b = Math.round((r.o / r.s - 1) * 100);
      r.rel = Math.round(((r.o / r.s) / med - 1) * 100);
    }else if(r.hidPct != null && hidMed[r.p] != null){
      r.b = r.hidPct;
      r.rel = Math.round(r.hidPct - hidMed[r.p]);
    }else{ r.b = null; r.rel = null; }
  });

  /* Within position: the honest read of whether he got better than his peers.
     Overall: the board reshuffling, which is where the tight end story lives. */
  /* Both sides get the same two movement columns, each against the baseline its
     own half of the board is misled by. Offence moves from standard PPR to this
     league's rules. Defence moves from what the Sleeper app shows to what the
     player is really worth once the three unprojected stats are priced. */
  rows.forEach(r => {
    const isOff = OFF.includes(r.p);
    r._before = isOff ? r.s : r.app;
    r._after  = isOff ? r.o : (r.app != null && r.hid != null ? +(r.app + r.hid).toFixed(2) : null);
  });
  for(const b of OFF.concat(DEF))
    for(const [fld, key] of [["_before","pP"], ["_after","pO"]])
      rows.filter(r => r.p === b && r[fld] != null)
          .sort((x,y) => y[fld] - x[fld]).forEach((r,i) => r[key] = i + 1);
  /* Overall movement is across your own side of the ball, so a linebacker is
     measured against every defender rather than against wide receivers. */
  for(const side of [OFF, DEF])
    for(const [fld, key] of [["_before","rP"], ["_after","rO"]])
      rows.filter(r => side.includes(r.p) && r[fld] != null)
          .sort((x,y) => y[fld] - x[fld]).forEach((r,i) => r[key] = i + 1);
  rows.forEach(r => {
    r.pm = (r.pP && r.pO) ? r.pP - r.pO : null;
    r.om = (r.rP && r.rO) ? r.rP - r.rO : null;
  });

  /* Board rank: overall and positional, by VORP. This is how picks get reported. */
  rows.sort((a,b) => b.v - a.v).forEach((r,i) => r.rk = i + 1);
  /* And this week's order by raw projected points, which is the one that answers
     "who is best this week" rather than "who is worth the most over a season". */
  rows.slice().sort((a,b) => b.o - a.o).forEach((r,i) => r.wrk = i + 1);
  for(const b of OFF.concat(DEF))
    rows.filter(r => r.p === b).sort((x,y) => y.v - x.v).forEach((r,i) => r.prk = i + 1);

  /* Implied ADP: where your rules say each player should actually go. Room
     neutral on purpose, so it excludes the personal terms (need, QB check,
     strike timing) and stays a property of the board rather than your roster.
     Compare it against market ADP to see where the room disagrees with you. */
  /* Our ADP. An ADP is a prediction of where a player actually goes, so it is
     anchored to the market rather than to our own ranking, then corrected for
     the two things the market does not price for this league: our scoring
     (the rules edge, how far the rulebook favours him against the field) and
     dynasty runway (Fut, or the age curve where no dynasty value is published).

         our ADP = market ADP / (rules edge x dynasty weight)

     Favour him more than the market does and he moves earlier; less and he
     slides. Defenders carry no rules edge because they have no standard
     baseline, so nothing pulls them forward and they stay where the room
     actually takes them, which is late. ADP is used here purely as a timing
     anchor, never as a measure of value: VORP remains the value number. */
  /* Rebuild defensive ADP from our value order, spread so the last of the 108
     league-wide IDP starters is gone by the end of the draft. */
  const idpStarters = (starts.DL || 0) + (starts.LB || 0) + (starts.DB || 0);
  const lastPick = teams * (draft.rounds || 45);
  /* Spread the 108 league-wide IDP starters across the picks that remain after
     the anchor. Packing them tighter than this breaks the survival maths: every
     defender ends up either comfortably ahead of you or hopelessly behind, none
     ever borderline, so P(gone) is always zero and the Now column goes dead for
     nine of your nineteen starting slots. */
  const spacing = idpStarters > 0
    ? Math.max(1, (lastPick - RULES.idpFirstPick) / idpStarters) : 3;
  rows.filter(r => DEF.includes(r.p)).sort((a,b) => b.v - a.v)
      .forEach((r,i) => r.adpIdpRaw = r.adp, );
  rows.filter(r => DEF.includes(r.p)).sort((a,b) => b.v - a.v)
      .forEach((r,i) => r.adp = +(RULES.idpFirstPick + i * spacing).toFixed(1));

  rows.forEach(r => {
    if(r.adp == null){ r.cadp = null; return; }
    const edge = 1 + (r.rel || 0) / 100;
    const mult = r.f != null ? r.f : ageMult(r.a);
    r.cadp = +(r.adp / Math.max(0.2, edge * mult)).toFixed(1);
  });
  rows.slice().sort((a,b) => (a.cadp == null ? 1e9 : a.cadp) - (b.cadp == null ? 1e9 : b.cadp))
      .forEach((r,i) => r.iadp = i + 1);

  const posMed = b => {
    const m = median(rows.filter(r => r.p === b && r.b != null).map(r => r.b));
    return m == null ? null : Math.round(m);
  };
  /* Share of score resting on the backfill, averaged per defensive position. */
  const bfMean = b => {
    const v = rows.filter(r => r.p === b && r.bf != null).map(r => r.bf);
    return v.length ? Math.round(100 * v.reduce((a,c) => a + c, 0) / v.length) : null;
  };
  return {R, Rsleep, starts, dry, med: med ? +((med - 1) * 100).toFixed(1) : null,
          te:posMed("TE"), qb:posMed("QB"), rb:posMed("RB"), wr:posMed("WR"),
          bf:{DL:bfMean("DL"), LB:bfMean("LB"), DB:bfMean("DB")}, hidMed};
}

/* ------------------------------------------------------------- data access */
async function loadPlayers(hard){
  if(!hard){
    try{
      const c = JSON.parse(localStorage.getItem(PLAYER_CACHE_KEY) || "null");
      if(c && Date.now() - c.t < PLAYER_CACHE_MS){ PLAYER_SEEN = c.seen || 0; return c.d; }
    }catch(e){ /* corrupt cache, refetch */ }
  }
  const raw = await jget("https://api.sleeper.app/v1/players/nfl");
  const d = {};
  let seen = 0;
  for(const id in raw){
    const p = raw[id], fp = p.fantasy_positions || [];
    seen++;
    /* Sleeper lists every slot a player qualifies for and plenty of defenders
       carry two. In a league starting nine of them that is real flexibility, so
       keep the whole list rather than the first match. The primary is still one
       position, because replacement level and VORP need him in exactly one pool. */
    /* Eligibility comes from fantasy_positions on both sides of the ball, with
       the listed position only as a fallback. Reading offence off p.position
       alone dropped anyone whose listed position is not itself a fantasy slot:
       a fullback listed FB but eligible at RB never reached the board at all,
       and neither did any offensive player Sleeper files under a label we do
       not start. It also lost the second position of a dual-eligible skill
       player, which defence has always kept. */
    const all = OFF.concat(DEF);
    let elig = all.filter(x => fp.includes(x));
    if(!elig.length && all.includes(p.position)) elig = [p.position];
    if(!elig.length) continue;      // kickers, team defences, linemen: no slot starts them
    /* Primary stays a single position, because replacement level and VORP need
       him in exactly one pool. Offence prefers his listed position when that is
       itself a fantasy slot. Defence keeps the canonical DL, LB, DB order it has
       always used: a defender's listed position is his NFL position, so DE, OLB
       and CB are the norm and preferring it would only fire for the handful
       Sleeper happens to file under a slot name, splitting the rule. */
    if(OFF.includes(p.position) && elig.includes(p.position))
      elig = [p.position].concat(elig.filter(x => x !== p.position));
    /* Injury status and depth-chart order ride along in the cached record. They
       are the closest thing to team news available without leaving Sleeper, and
       they are the two fields that actually change a start/sit call. */
    d[id] = [((p.first_name||"") + " " + (p.last_name||"")).trim(), elig[0], p.team || "",
             p.age != null ? p.age : null, p.years_exp != null ? p.years_exp : null, elig,
             p.injury_status || null,
             p.depth_chart_order != null ? p.depth_chart_order : null];
  }
  PLAYER_SEEN = seen;
  try{ localStorage.setItem(PLAYER_CACHE_KEY, JSON.stringify({t:Date.now(), d, seen})); }catch(e){}
  return d;
}

/* The market's own view of how much value lies ahead, controlling for current
   production rather than just penalising age. */
function futureMultipliers(fcalc){
  const f = {};
  for(const e of (fcalc||[])){
    const id = e.player && e.player.sleeperId, rd = e.redraftValue || 0;
    if(!id) continue;
    f[id] = rd > 40 ? +Math.sqrt(Math.max(.6, Math.min(2.4, e.value / rd))).toFixed(2) : 1.14;
  }
  return f;
}

/* Optional second opinion. ESPN needs a custom header, which triggers a CORS
   preflight they may not answer — so this runs after the board is already up
   and simply does not appear when it fails. */
const ESPN_MAP = {"0":"pass_att","1":"pass_cmp","3":"pass_yd","4":"pass_td","20":"pass_int",
                  "23":"rush_att","24":"rush_yd","25":"rush_td","42":"rec_yd","43":"rec_td",
                  "53":"rec","72":"fum_lost"};
const norm = n => String(n).toLowerCase().replace(/[.'-]/g,"")
  .replace(/\s+(jr|sr|ii|iii|iv|v)$/,"").replace(/[^a-z0-9]/g,"");

async function loadEspn(){
  const hdr = {"x-fantasy-filter": JSON.stringify({players:{limit:1200, offset:0,
    sortPercOwned:{sortAsc:false, sortPriority:1}}})};
  const raw = await jget(`https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/${SEASON}` +
                         `/segments/0/leaguedefaults/3?view=kona_player_info`, {headers:hdr});
  const by = {};
  for(const e of (raw.players || [])){
    const pl = e.player; if(!pl) continue;
    for(const st of (pl.stats || [])){
      if(st.seasonId === SEASON && st.statSourceId === 1 && st.statSplitTypeId === 0 && st.stats){
        const line = {};
        for(const k in st.stats) if(ESPN_MAP[k]) line[ESPN_MAP[k]] = st.stats[k] / 17;
        by[norm(pl.fullName)] = line;
        break;
      }
    }
  }
  return by;
}

/* ESPN omits first downs, which this league pays for. Estimate from the
   player's own 2025 rate where the sample supports it. */
function firstDowns(line, ac, position){
  const g = ac.gp || 0;
  let recRate, rushRate;
  if(g >= 8 && ((ac.rec||0) + (ac.rush_att||0)) > 20){
    recRate = (ac.rec_fd||0) / Math.max(ac.rec||1, 1);
    rushRate = (ac.rush_fd||0) / Math.max(ac.rush_att||1, 1);
  }else{
    [recRate, rushRate] = position === "RB" ? [0.42, 0.24] : [0.52, 0.22];
  }
  return {rec_fd:(line.rec||0) * recRate, rush_fd:(line.rush_att||0) * rushRate};
}

/* ----------------------------------------------------------------- columns */
function columns(){
  const {p1, p2} = futurePicks();
  const cols = [
    {k:"iadp", h:"#", tip:"The board: rank by Our ADP, where each player actually goes once corrected for this league's scoring and your dynasty rules. Static, so you can quote it all draft. VORP is still the value number and is verified against seven confirmed season figures; this is the draft order.",
      cell:r => `<span class="rk">${r.iadp}</span>`},
    {k:"n",   h:"Player", cls:"l",
      tip:"An amber ! means under 8 games in 2025, so his pass defended, TFL and QB hit backfill is unreliable.",
      cell:r => {
      const own = taken.get(r.id);
      const tag = !own ? "" : isMine(own)
        ? '<span class="gl you">yours</span>' : '<span class="gl">drafted</span>';
      const thin = r.thin ? `<span class="thin" title="Only ${r.g25} games in 2025 — the pass defended, TFL and QB hit backfill is unreliable for him">!</span>` : "";
      /* Every number on this board is per game, so a short projection is a real
         rate on a small denominator rather than a small number. Say so, or a
         four-game projection reads as a starter. */
      const part = r.full ? "" : `<span class="mech mc" title="Sleeper projects him only ${r.gp12} games, so every per-game number here is a rate off that short a denominator. He is on the board but out of the replacement-level fill.">${r.gp12}G</span>`;
      const mech = r.mech && r.mech !== "BOTH"
        ? `<span class="mech ${r.mech === "RUSH" ? "mr" : "mc"}" title="${r.mech === "RUSH"
            ? "Hidden by QB hits and TFL, which Sleeper does not project" 
            : "Hidden by pass defended, which Sleeper does not project"}">${r.mech}</span>` : "";
      return `<span class="nm">${esc(r.n)}</span>${thin}${part}${mech}${tag}`;
    }},
    {k:"p",   h:"Pos",  cls:"l",
      tip:"Position, and the small number is his rank there on this board. A second position after a slash means Sleeper lists him eligible at both, which matters in a league starting nine defenders because he covers more slots. Filtering on either one will find him. Shift-click position buttons to combine them.",
      cell:r => {
      const [fg,bg] = PC[r.p];
      /* A defender who qualifies at two spots fills more of your nine IDP slots,
         so show the second one rather than burying it. */
      const alt = (r.elig || []).filter(e => e !== r.p);
      return `<span class="p" style="color:${fg};background:${bg}">${r.p}</span>` +
             (alt.length ? `<span class="alt" title="Also eligible at ${alt.join(" and ")}, so he covers more of your nine IDP starting slots">/${alt.join("/")}</span>` : "") +
             `<span class="prk">${r.prk}</span>`;
    }},
    {k:"t",   h:"Tm",   cls:"l", tip:"NFL team. FA means Sleeper lists no team for him.",
      cell:r => `<span class="fl">${esc(r.t)}</span>`},
    {k:"a",   h:"Age",  tip:"Age. Feeds the Age term in Our BPA, which scores 3% per year either side of 26.",
      cell:r => `<span class="fl">${r.a != null ? r.a : "—"}</span>`},
    {k:"adp", h:"ADP",
      tip:"What the market does. Offence is Sleeper's dynasty superflex ADP. Defenders show amber because no dynasty IDP ADP exists anywhere, so they fall back to a redraft-flavoured number. An input for survival modelling only, never a measure of value.",
      title:r => OFF.includes(r.p) ? "Sleeper dynasty superflex ADP (adp_dynasty_2qb)"
                                   : "Sleeper IDP ADP (adp_idp). NOT dynasty, no dynasty IDP ADP is published",
      cell:r => `<span class="fl${OFF.includes(r.p) ? "" : " thin"}">${fmt(r.adp)}</span>`},
    {k:"cadp", h:"Our ADP",
      tip:"Where he actually goes, corrected for this league. Market ADP divided by the rules edge and the dynasty weight, so a player our rulebook favours more than the field moves earlier and a win-now asset slides. Defenders have no rules edge, so nothing pulls them forward and they stay as late as the room really takes them. The # column is the rank of this number.",
      title:r => r.cadp == null ? "No market ADP to anchor to"
        : `Market ${r.adp}, ours ${r.cadp}` + (Math.abs(r.cadp - r.adp) < 1 ? ", the market has him about right"
            : r.cadp < r.adp ? `, we would take him ${Math.round(r.adp - r.cadp)} picks earlier`
                             : `, we would let him slide ${Math.round(r.cadp - r.adp)} picks`),
      cell:r => {
        if(r.cadp == null) return '<span class="fl">—</span>';
        const d = r.adp - r.cadp;
        return `<span class="${d >= 6 ? "up" : d <= -6 ? "dn" : "fl"}">${r.cadp}</span>`;
      }},
    {k:"app", h:"App",  cls:"",
      tip:"What your leaguemates see. The raw Sleeper projection scored under this league's rules with no backfill at all. Sleeper's payload has no pass defended, no TFL and no QB hits, worth 3, 2 and 1 point here, so the number in their draft interface is systematically low. Offence is unaffected and shows a dash.",
      cell:r => r.app == null ? '<span class="fl">—</span>' : `<span class="fl">${fmt(r.app)}</span>`},
    {k:"hid", h:"Hidden", cls:"",
      tip:"True minus App, per game: the points the Sleeper app cannot see because it does not project pass defended, TFL or QB hits. This is the edge. The Boost column shows it as a share of true score, and vs med compares that share against the median for his own position.",
      title:r => {
        if(r.hid == null) return "";
        let t = `App ${fmt(r.app)} + hidden ${fmt(r.hid)} = ${fmt(r.app + r.hid)}, matching Ours.` +
          (r.mech === "RUSH" ? " Hidden mostly by QB hits and TFL, an edge rusher."
           : r.mech === "COV" ? " Hidden mostly by pass defended, a coverage player." : "");
        if(r.rates){
          t += `\n\nRates shrunk toward the ${r.p} mean. Each stat has its own weight and its`;
          t += `\nown denominator, because pass defended tracks tackle volume while TFL and`;
          t += `\nQB hits track snaps:`;
          for(const k of BACKFILL_RATE){
            const nm = k === "idp_pass_def" ? "PD" : k === "idp_tkl_loss" ? "TFL" : "QB hit";
            const pct = Math.round(r.rates.w[k] * 100);
            t += `\n  ${nm} per ${r.rates.per[k]}: his ${r.rates.raw[k]} vs ${r.p} mean ` +
                 `${r.rates.lg[k]}, ${pct}% his own`;
          }
        }
        return t;
      },
      cell:r => r.hid == null ? '<span class="fl">—</span>'
        : `<span class="b ${r.hid >= 3 ? "up" : ""}">+${fmt(r.hid)}</span>`},
    {k:"ppr", h:"PPR",  cls:"",
      tip:"Comparison baseline only, never what you score. Offence is standard full PPR run on the same stat line. Defenders have no PPR categories at all, so this is the points per game Sleeper itself publishes under its own default IDP scoring: a third rulebook again, useful as rough context rather than a like-for-like number.",
      title:r => r.ppr == null ? "No PPR figure published for him"
        : OFF.includes(r.p) ? "Standard full PPR on the same projection"
        : "Sleeper's own pts_ppr, under its default IDP scoring rather than ours",
      cell:r => `<span class="fl">${fmt(r.ppr)}</span>`},
    {k:"o",   h:"Ours", tip:"Points per game under this league's actual scoring settings, pulled live and applied to his 2026 projection.",
      cell:r => `<span class="b">${fmt(r.o)}</span>`},
    {k:"a25", h:"2025", cls:"",
      tip:"What he actually did per game in 2025 under this league's scoring. Reads slightly high against Ours because real stats include the 100 and 200 yard game bonuses that projections cannot.",
      cell:r => `<span class="fl">${fmt(r.a25)}</span>`},
  ];
  if(espnCount) cols.push({k:"es", h:"ESPN", cls:"",
    tip:"ESPN's projection scored the same way, as a second opinion. Display only: it never touches Ours, VORP or any ranking.",
    cell:r => `<span class="fl">${fmt(r.es)}</span>`});
  cols.push(
    {k:"now", h:"Now",
      tip:"Cost of waiting, and what the board is ranked by. What you gain by taking him on this pick instead of taking the best player left at his position when you next choose. VORP asks how much better than free he is; this asks what you actually lose by waiting, which is the draft decision. Steep positions score high, flat and deep ones score near zero because the room hands you a near identical player later.",
      title:r => r.now == null ? "No next pick to measure against"
        : `Taking him now gains ${fmt(r.now,2)} ppg over the best ${r.p} expected to survive to your next pick`,
      cell:r => {
        if(r.now == null) return '<span class="fl">—</span>';
        /* A dash, not 0.00. Zero would read as a computed cost of nothing when
           it actually means he is certain to still be there, so there is no
           decision to make. */
        if(r.s1 != null && r.s1 >= 0.995) return '<span class="fl" title="Certain to last to your next pick, nothing to lose by waiting">—</span>';
        const c = r.now >= 2 ? "up" : r.now <= 0.25 ? "fl" : "";
        return `<span class="b ${c}">${fmt(r.now,2)}</span>`;
      }},
    {k:"v",  h:"VORP",
      tip:"Points per game above replacement at his own position. Replacement is the best player you could get for free once all 12 teams have filled every starting slot, computed live at QB " +
          (META.R ? `${META.R.QB}, RB ${META.R.RB}, WR ${META.R.WR}, TE ${META.R.TE}` : "19.9, RB 14.0, WR 14.1, TE 14.2") +
          ". Not a comparison against the next player on the board. Measuring everyone against their own free baseline is what makes positions comparable.",
      cell:r => `<span class="b">${fmt(r.v,2)}</span>`},
    {k:"f",  h:"Fut",  cls:"",
      tip:"Dynasty value divided by redraft value, square rooted, from FantasyCalc. Above 1.15 means the market sees real runway ahead, below 0.92 means a win-now asset. Blank for defenders because no dynasty IDP values are published.",
      cell:r =>
      r.f == null ? '<span class="fl">—</span>'
      : `<span class="${r.f >= 1.15 ? "up" : r.f <= .92 ? "dn" : "fl"}">${r.f.toFixed(2)}</span>`},
    {k:"pm", h:"Pos±", cls:"",
      tip:"Rank change within his own position, and the honest read of whether he gained on his direct peers. Offence moves from standard full PPR to this league's rules. Defence moves from the score the Sleeper app displays to what he is really worth once pass defended, TFL and QB hits are priced. Positive means he climbs his own position group.",
      title:r => r.pP ? `${r.p}${r.pP} → ${r.p}${r.pO} within position` +
        (OFF.includes(r.p) ? ", standard PPR to our rules" : ", Sleeper app to true value") : "",
      cell:r => move(r.pm)},
    {k:"om", h:"Ov±",  cls:"",
      tip:"Rank change across his whole side of the ball, offence against offence and defence against defence. Where the board reshuffles: elite tight ends hold their positional rank but jump 12 to 20 spots overall, and the same happens to edge rushers once QB hits and TFL are priced.",
      title:r => r.rP ? `overall ${r.rP} → ${r.rO} across all ` +
        (OFF.includes(r.p) ? "offence" : "defence") : "",
      cell:r => move(r.om)},
    {k:"b",  h:"Boost", cls:"",
      tip:"Raw scoring inflation, this league against standard PPR. Close to meaningless on its own since the league inflates everyone by about 60%. Use vs med instead.",
      cell:r => r.b == null ? '<span class="fl">—</span>' : r.b + "%"},
    {k:"rel", h:"vs med",
      tip:"Offence: scoring boost measured against the league median, so green means the rulebook favours him more than it favours the field. Defence: hidden share measured against the median for his own position, so green means more of his value is invisible to the room than is typical for a DL, LB or DB.",
      cell:r => {
      if(r.rel == null) return '<span class="fl">—</span>';
      const bg = r.rel >= 2 ? "var(--upbg)" : r.rel <= -2 ? "var(--dnbg)" : "transparent";
      const fg = r.rel >= 2 ? "var(--up)" : r.rel <= -2 ? "var(--dn)" : "var(--faint)";
      return `<span class="pill" style="background:${bg};color:${fg}">${r.rel > 0 ? "+" : ""}${r.rel}</span>`;
    }}
  );
  const survTip = n => "Chance he is still on the board at your pick #" + n + ", given he is " +
    "available right now. Calibrated to this room, which reaches about 18 spots early for rookies " +
    "and lets 28 year olds slide. Directional only, and context for planning several picks ahead, " +
    "never a reason to pass on a better player.";
  if(p1) cols.push({k:"s1", h:"@" + p1, tip:survTip(p1), tr:true,
                    title:() => `Chance he is still there at your pick #${p1}`,
                    cell:r => survCell(r.s1)});
  if(p2) cols.push({k:"s2", h:"@" + p2, tip:survTip(p2), tr:true,
                    title:() => `Chance he is still there at your pick #${p2}`,
                    cell:r => survCell(r.s2)});
  if(!isWeek()) return cols;
  /* Week mode drops the draft furniture rather than rewriting the list: ADP,
     Our ADP, the cost of waiting, survival and the dynasty multiplier all answer
     "when do I take him", which is a question that no longer exists. */
  const DRAFT_ONLY = new Set(["iadp","adp","cadp","now","s1","s2","f"]);
  const out = cols.filter(c => !DRAFT_ONLY.has(c.k));
  /* Rank on this week's projection, so the first column is still the board
     order and still something you can quote. */
  out.unshift({k:"wrk", h:"#",
    tip:"This week's order by projected points under your scoring. Recomputed every refresh, unlike the draft board's static number.",
    cell:r => `<span class="rk">${r.wrk ?? "—"}</span>`});
  /* Status earns a column because it is the only thing here that overrides the
     arithmetic: a 22 point projection on a player listed Out is not 22 points. */
  out.splice(4, 0, {k:"st", h:"Status", cls:"l",
    tip:"Injury designation from Sleeper, and BYE for a player whose team has nobody projected this week. A player on bye is scored at zero rather than dropped, so the optimiser never starts someone who is not playing. Sleeper's own weekly projection already prices in a designation once it is published, so this is the flag rather than a second haircut.",
    cell:r => statusCell(r)});
  const ours = out.find(c => c.k === "o");
  if(ours){ ours.h = "Proj";
    ours.tip = "Points this week under this league's actual scoring settings, pulled live and applied to Sleeper's weekly projection. A week's total, not a per-game rate."; }
  const ppr = out.find(c => c.k === "ppr");
  if(ppr) ppr.h = "PPR";
  const a25 = out.find(c => c.k === "a25");
  if(a25) a25.h = "2025 pg";
  return out;
}

/* Out and Doubtful are the two that change a lineup; the rest are context. */
const INJ_HARD = new Set(["Out","IR","PUP","Sus","NA","DNR"]);
function statusCell(r){
  if(r.onBye) return '<span class="pill" style="background:var(--dnbg);color:var(--dn)" ' +
