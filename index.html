    'title="His team has nobody in this week\'s projections, so they are on bye. Scored at zero.">BYE</span>';
  if(r.inj){
    const hard = INJ_HARD.has(r.inj) || /^Out|IR|Susp/i.test(r.inj);
    const q = /^Quest/i.test(r.inj), d = /^Doubt/i.test(r.inj);
    const fg = hard ? "var(--dn)" : d ? "var(--dn)" : q ? "var(--hot)" : "var(--dim)";
    const bg = hard || d ? "var(--dnbg)" : q ? "var(--hotbg)" : "var(--surf2)";
    return `<span class="pill" style="background:${bg};color:${fg}" title="Sleeper injury designation">${esc(r.inj)}</span>`;
  }
  if(r.noproj) return '<span class="fl" title="Sleeper publishes no projection for him this week. Scored at zero rather than dropped.">no proj</span>';
  return '<span class="fl">—</span>';
}
const move = v => v == null ? '<span class="fl">—</span>'
  : `<span class="${v > 0 ? "up" : v < 0 ? "dn" : "fl"}">${v > 0 ? "+" : ""}${v}</span>`;
function survCell(p){
  if(p == null) return '<span class="fl">—</span>';
  const pct = Math.round(p * 100);
  const fg = pct >= 60 ? "var(--up)" : pct >= 25 ? "var(--hot)" : "var(--dn)";
  const bg = pct >= 60 ? "var(--upbg)" : pct >= 25 ? "var(--hotbg)" : "var(--dnbg)";
  return `<span class="pill" style="background:${bg};color:${fg}">${pct}%</span>`;
}

/* ------------------------------------------------------------------ render */
function render(){
  if(!ROWS.length) return;
  const {cur, p1, p2} = futurePicks();
  ROWS.forEach(r => {
    r.s1 = survival(r.adp, r.reach, p1, cur);
    r.s2 = survival(r.adp, r.reach, p2, cur);
  });
  const drop = costOfWaiting();      // needs s1, so it runs after survival
  renderCalib(drop);

  const cols = columns();
  /* The column set changes as the draft moves and as ESPN comes and goes, so a
     sort key can vanish underneath us. */
  if(!cols.some(c => c.k === sortKey)){ sortKey = "v"; sortDir = -1; }
  /* Explicit widths and a fixed layout. With table-layout:auto the browser has
     to measure every cell in every row to size the columns, which is a full
     content pass over the whole board: at 688 rows that was 589ms of layout on
     every sort click, and it grows with the pool. Fixed layout sizes from the
     colgroup alone and makes layout O(rows). */
  /* Capped on phones, or the two pinned identity columns eat 244 of the 354px
     scroller and leave almost nothing to pan the other nineteen through. */
  const narrow = innerWidth <= 900;
  const colw = c => c.k === "n" && narrow ? 132 : (COLW[c.k] || 52);
  $("cg").innerHTML = cols.map(c => `<col style="width:${colw(c)}px">`).join("");
  $("hr").innerHTML = cols.map((c,i) =>
    `<th class="${c.cls||""}${c.tr || i >= cols.length - 3 ? " tr" : ""}" data-k="${c.k}"` +
    (c.tip ? ` data-tip="${esc(c.tip)}"` : "") +
    `${c.k === sortKey ? " data-on" : ""}>${c.h}</th>`).join("");

  const q = $("q").value.trim().toLowerCase();
  const hideDrafted = $("hide").checked, youngOnly = $("yng").checked;
  const rs = ROWS.filter(r => {
    /* Match on any position he qualifies for, and accept any of the selected
       filters, so RB plus WR shows both and an LB/DB shows under either. */
    if(pos.size && !r.elig.some(e => pos.has(e))) return false;
    if(hideDrafted && taken.has(r.id)) return false;
    if(youngOnly && (r.a == null || r.a > 26)) return false;
    if(q && !r.n.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b) => {
    const x = a[sortKey], y = b[sortKey];
    let c = 0;
    if(x == null && y == null) c = 0;
    else if(x == null) return 1;              // blanks always trail, either direction
    else if(y == null) return -1;
    else c = typeof x === "string" ? sortDir * x.localeCompare(y) : sortDir * (x - y);
    /* Every sort falls back to board order, so grouping by position or team lists
       each group best-first instead of in whatever order the last sort left. */
    return c || (b.v - a.v);
  });

  /* Everything is in the pool: every row here is sorted, filtered, searched and
     scored. What is bounded is only how many get PAINTED, because laying out a
     row of 21 cells costs real time and the cost goes super-linear: 688 rows
     take about 0.4s and 2750 take nearly 9s, on every sort click. The default
     covers the whole draft; the footer moves it. */
  const cap = ROWCAP == null ? Math.max(600, draft.teams * draft.rounds)
            : ROWCAP < 0 ? rs.length : ROWCAP;
  const shown = rs.slice(0, cap);
  $("tb").innerHTML = shown.map(r => {
    const own = taken.get(r.id);
    const cls = own ? (isMine(own) ? "own" : "gone") : "";
    return `<tr class="${cls}" data-id="${r.id}">` + cols.map(c => {
      const t = c.title ? c.title(r) : "";
      return `<td class="${c.cls||""}"${t ? ` title="${esc(t)}"` : ""}>${c.cell(r)}</td>`;
    }).join("") + "</tr>";
  }).join("");

  const R = META.R, S = META.starts;
  $("ft").innerHTML =
    `${rs.length} of ${ROWS.length} scored, ` +
    (shown.length < rs.length
      ? `<span style="color:var(--hot)">${shown.length} drawn</span>`
      : "all drawn") +
    ` draw ${[["draft", null], ["600", 600], ["1200", 1200], ["all", -1]].map(([lbl, n]) =>
        `<button class="lnk${ROWCAP === n ? " on" : ""}" data-cap="${n == null ? "" : n}">` +
        `${lbl}</button>`).join(" &middot; ")} &middot; ` +
    `pool built from ${PLAYER_SEEN || "?"} players Sleeper lists at a startable position` +
    (DROP.gp || DROP.meta
      ? `, ${DROP.gp} dropped for no projected games and ${DROP.meta} for no player record`
      : "") + ` &middot; ` +
    `${ROWS.filter(r => !r.full).length} carry a partial-season projection and are kept out of ` +
    `the replacement fill &middot; ` +
    `replacement QB ${R.QB} RB ${R.RB} WR ${R.WR} TE ${R.TE} DL ${R.DL} LB ${R.LB} DB ${R.DB} &middot; ` +
    `league-wide starts QB ${S.QB} RB ${S.RB} WR ${S.WR} TE ${S.TE} DL ${S.DL} LB ${S.LB} DB ${S.DB}` +
    `<br>` +
    ((META.dry || []).length
      ? `<span style="color:var(--hot)">Every startable ${META.dry.join(", ")} was consumed ` +
        `filling the lineup, so ${META.dry.length > 1 ? "those replacement levels are" : "that replacement level is"} ` +
        `a floor and VORP reads high there.</span><br>` : "") +
    `Sleeper ${SEASON} projections + ${PRIOR} actuals + FantasyCalc` +
    (espnCount ? ` + ESPN (${espnCount} matched)` : "") +
    `, scored live in your browser &middot; data pulled ${lastLoad ? lastLoad.toLocaleTimeString() : "—"} ` +
    `<button class="lnk" id="hardreload">reload player list</button>` +
    ` &middot; mode <button class="lnk${isWeek() ? " on" : ""}" data-mode="week">week</button>` +
    ` &middot; <button class="lnk${isWeek() ? "" : " on"}" data-mode="draft">draft board</button>`;
  const hr = $("hardreload");
  if(hr) hr.onclick = () => loadAll({hardPlayers:true});
  for(const b of $("ft").querySelectorAll("button[data-cap]"))
    b.onclick = () => { ROWCAP = b.dataset.cap === "" ? null : +b.dataset.cap; render(); };
  /* Switching mode changes which feeds the page reads, so it reloads rather than
     re-rendering: the rows themselves mean something different on the other side. */
  for(const b of $("ft").querySelectorAll("button[data-mode]"))
    b.onclick = () => {
      if(b.dataset.mode === MODE) return;
      MODE = b.dataset.mode;
      try{ localStorage.setItem("idp_mode", MODE); }catch(e){}
      sortKey = isWeek() ? "o" : "adp"; sortDir = isWeek() ? -1 : 1;
      loadAll({});
    };

  /* Recommendations track the pool, not the table filters, but they need the
     survival numbers this function just refreshed. */
  if(isWeek()) weekHeader();
  renderRecs();
  renderLeague();
  stick();
}

/* The picks that cost-of-waiting is measured against. When you are on the clock
   the pick you are making now is NOT the answer to "what does waiting cost":
   survival to your own current pick is trivially 100% and the Now column dies.
   The relevant horizon is always the picks strictly after this one. */
function futurePicks(){
  const cur = made + 1;
  const rest = MY_PICKS.filter(n => n >= cur);
  const onClock = rest[0] === cur;
  return {cur, p1: (onClock ? rest[1] : rest[0]) || null,
               p2: (onClock ? rest[2] : rest[1]) || null};
}

/* --------------------------------------------------------------- start / sit */
/* The three boxes, in season. Same shape as the draft ones and the same rule
   behind them: the arithmetic decides, the judgement is stated. */
function renderStartSit(){
  const mine = myRoster;
  if(!mine.length){ $("recs").innerHTML =
    `<div class="rec"><h4>Your roster</h4><div class="who">Nothing rostered</div>` +
    `<div class="why">Sleeper's rosters endpoint returned no players for roster ` +
    `${MY_ROSTER_ID == null ? "?" : MY_ROSTER_ID}. Check the slot constant if that is wrong.</div></div>`;
    return; }
  const slots = META.slots || {};
  const {lineup, bench} = lineupFor(mine, slots, META.R, "o", false);
  const total = lineup.reduce((a,x) => a + (x.r ? x.r.o : x.fa), 0);

  /* The actual start/sit call: someone on the bench who outscores a starter he
     is legally allowed to replace. The optimal assignment means this list is
     empty whenever the lineup on this page is already the best one, so it is
     only ever telling you about a lineup you have set differently in Sleeper. */
  const swaps = [];
  for(const x of lineup){
    if(!x.r) continue;
    for(const b of bench){
      if(!b.elig.some(p => x.takes.includes(p))) continue;
      if(b.o > x.r.o + 0.05) swaps.push({slot:x.slot, out:x.r, in:b, gain:+(b.o - x.r.o).toFixed(1)});
    }
  }
  swaps.sort((a,b) => b.gain - a.gain);

  /* Two different problems, and the first is the one with a deadline. A streamed
     slot means no rostered player beats a waiver body there this week, so it is
     an add. A flagged player is context whether or not he is starting: once the
     optimiser correctly benches a man on his bye he vanishes from the lineup,
     and a Watch box that only reads the lineup would then go quiet about exactly
     the thing you wanted flagged. */
  const holes = lineup.filter(x => !x.r);
  const risk = mine.filter(r => r.onBye || r.noproj || r.inj)
                   .sort((a,b) => b.o - a.o);
  const started = new Set(lineup.filter(x => x.r).map(x => x.r.id));

  const num = (k, v) => `<div class="num"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const nm = r => `<em>${esc(r.n)}</em> <span class="fl">${r.p}${r.prk}` +
                  `${r.t ? " · " + esc(r.t) : ""}</span>`;

  const best = lineup.filter(x => x.r).sort((a,b) => b.r.o - a.r.o)[0];
  const lineBox =
    `<div class="rec"><h4>Week ${WEEK || "?"} lineup</h4>` +
    `<div class="who">${fmt(total)} projected</div>` +
    `<div class="meta">${lineup.filter(x => x.r).length}/${lineup.length} slots filled from ` +
    `${mine.length} rostered${holes.length ? ` · <span class="dn">${holes.length} streamed at replacement</span>` : ""}</div>` +
    `<div class="nums">${num("Slots", lineup.length)}${num("Bench", bench.length)}` +
    `${num("Top", best ? fmt(best.r.o) : "—")}</div>` +
    `<div class="why">The best legal arrangement of your roster this week, by the same ` +
    `optimal assignment the draft board used, on Sleeper's week ${WEEK || "?"} projections run ` +
    `through your scoring. Top scorer is ${best ? nm(best.r) : "nobody"}. ` +
    `Open your team in the league table below for the slot-by-slot sheet.</div></div>`;

  const swapBox = swaps.length
    ? `<div class="rec"><h4>Start instead</h4>` +
      `<div class="who">${esc(swaps[0].in.n)}</div>` +
      `<div class="meta">over ${esc(swaps[0].out.n)} at ${SLOT_LABEL[swaps[0].slot] || swaps[0].slot}` +
      ` · +${fmt(swaps[0].gain)} this week</div>` +
      `<div class="nums">${num("In", fmt(swaps[0].in.o))}${num("Out", fmt(swaps[0].out.o))}` +
      `${num("Gain", "+" + fmt(swaps[0].gain))}</div>` +
      `<div class="why">` + swaps.slice(0, 6).map(w =>
        `${nm(w.in)} over ${nm(w.out)} at <b>${SLOT_LABEL[w.slot] || w.slot}</b>, ` +
        `<b>+${fmt(w.gain)}</b>`).join("<br>") +
      (swaps.length > 6 ? `<br><span class="fl">and ${swaps.length - 6} more</span>` : "") +
      `<br><br>Every one of these is a bench player who outscores a starter he is ` +
      `legally allowed to replace. Nothing here is a hunch.</div></div>`
    : `<div class="rec"><h4>Start instead</h4><div class="who">Nothing to change</div>` +
      `<div class="meta">no bench player outscores a starter he could replace</div>` +
      `<div class="why">The lineup above is already the highest-scoring legal arrangement ` +
      `of your roster. If Sleeper shows something different, Sleeper's lineup is the one ` +
      `costing you points.</div></div>`;

  const riskBox =
    `<div class="rec"><h4>${holes.length ? "Add someone" : "Watch"}</h4>` +
    `<div class="who">${holes.length ? holes.length + " slot" + (holes.length === 1 ? "" : "s") + " to stream"
                                     : risk.length ? risk.length + " flagged" : "All clear"}</div>` +
    `<div class="meta">${holes.length
      ? "no rostered player beats a waiver body there this week"
      : risk.length ? "on your roster: bye, out or carrying a designation"
                    : "nobody rostered is flagged and every slot is covered"}</div>` +
    `<div class="why">` +
    (holes.length
      ? holes.map(x => `<b>${SLOT_LABEL[x.slot] || x.slot}</b> ` +
          `<span class="fl">${x.takes.join("/")}</span>, streaming is worth <b>${fmt(x.fa)}</b>`).join("<br>") +
        `<br><br>These are adds, not lineup choices. Replacement level is what the best ` +
        `freely available player at that position projects for, so a slot lands here only ` +
        `when nobody you roster beats him.<br><br>`
      : "") +
    (risk.length
      ? `<b>Flagged on your roster</b><br>` + risk.slice(0, 10).map(r =>
          `${nm(r)} ${started.has(r.id) ? '<b>starting</b>' : '<span class="fl">benched</span>'}, ` +
          `${r.onBye ? '<span class="dn">on bye</span>'
            : r.noproj ? '<span class="dn">no projection this week</span>'
            : `<span class="dn">${esc(r.inj)}</span>`} · ${fmt(r.o)} projected`).join("<br>") +
        `<br><br>A player on bye or without a projection scores zero rather than being ` +
        `dropped from the pool, which is what stops the optimiser starting him. A ` +
        `designation is shown rather than deducted: Sleeper's weekly projection already ` +
        `prices one in once published, and a second haircut here would count it twice.`
      : `Nobody on your roster is on a bye, missing a projection or carrying an injury ` +
        `designation. Byes are derived from the projection payload rather than a bye ` +
        `table, since Sleeper publishes none on v1: a team with nobody projected is not ` +
        `playing.`) +
    `</div></div>`;

  $("recs").innerHTML = lineBox + swapBox + riskBox;
}

/* ------------------------------------------------------------ recommendations */
/* Three reads on the same pool, deliberately not blended into one number.
   BPA is VORP alone. Our BPA weights VORP by the dynasty multiplier. The rules
   edge is NOT applied on top of either: it is already inside Ours, and therefore
   inside VORP, so multiplying by it again would count the rulebook twice. */
/* VORP scaled by the rules above. Returns the parts as well as the total so the
   box can show its working. Only meaningful on positive VORP: multiplying a
   below-replacement player by a bonus would make him look better, not worse. */
function fit(r){
  const parts = [];
  let s = r.v;
  if(r.f != null){
    s = weight(s, r.f); parts.push(["Fut", r.f]);
  }else{
    /* No published dynasty value, so nothing has priced his age. */
    const am = ageMult(r.a);
    if(am !== 1){ s = weight(s, am); parts.push(["Age", +am.toFixed(2)]); }
  }
  if(s < 0) return {score: s, parts};        // below replacement, urgency is moot
  /* Expected cost of passing. A player certain to survive to your next pick
     costs you nothing to defer no matter how good he is, which is why the best
     linebacker drops out of the recommendation while staying high on iADP. No
     constant invented here: survival is already measured. Left out entirely
     when he has no ADP, since then there is nothing to condition on. */
  if(r.s1 != null){
    const gone = 1 - r.s1;
    s *= gone; parts.push(["P(gone by then)", +gone.toFixed(2)]);
  }
  return {score: s, parts};
}

function recommend(){
  const avail = ROWS.filter(r => !taken.has(r.id));
  if(!avail.length) return null;
  const top = (list, f) => list.reduce((a,b) => f(b) > f(a) ? b : a);

  /* Three usable QBs, judged against what is actually left on the board. */
  const qbShort = Math.max(0, 3 - myRoster.filter(r => r.p === "QB").length);
  const qbLeft = avail.filter(r => r.p === "QB" && r.o >= (META.R ? META.R.QB : 0)).length;
  const slots = META.slots || {};
  const nowFilled = rosterFill(myRoster, slots).reduce((a,f) => a + f.got, 0);
  const ctx = {
    qbShort, qbLeft,
    qbUrgent: qbShort > 0 && qbLeft <= qbShort * 3,
    fillsSlot: r => rosterFill(myRoster.concat([r]), slots)
                      .reduce((a,f) => a + f.got, 0) > nowFilled
  };
  const scored = new Map(avail.map(r => [r.id, fit(r)]));
  const dyn = r => scored.get(r.id).score;

  const byV = avail.slice().sort((a,b) => b.v - a.v);
  const byD = avail.slice().sort((a,b) => dyn(b) - dyn(a));
  const paths = {};
  for(const b of OFF.concat(DEF)){
    const sub = avail.filter(r => r.p === b);
    if(sub.length) paths[b] = top(sub, r => r.v);
  }
  return {bpa:byV[0], bpaNext:byV[1], ours:byD[0], oursNext:byD[1], paths, dyn, ctx,
          parts:r => scored.get(r.id).parts};
}

function renderRecs(){
  if(!ROWS.length || !META.R) return;
  if(isWeek()) return renderStartSit();
  const rec = recommend();
  if(!rec){ $("recs").innerHTML = ""; return; }
  const p1 = futurePicks().p1;

  /* Every number in these boxes is per game, so a short projection is a real
     rate on a small denominator. Left unsaid, a seven-game line tops best player
     available and reads as a full season. Stated, never scored: the arithmetic
     is right and the judgement is yours. */
  const line = r => `${r.p}${r.prk} · ${r.t || "FA"} · age ${r.a != null ? r.a : "?"} · board #${r.rk}` +
    (r.full ? "" : ` · <span class="dn">Sleeper projects him ${r.gp12} games, so this is a ` +
                   `per-game rate off a part season</span>`);
  const num = (k, v) => `<div class="num"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const box = (title, r, nums, why) =>
    `<div class="rec"><h4>${title}</h4>` +
    `<div class="who">${esc(r.n)}</div><div class="meta">${line(r)}</div>` +
    `<div class="nums">${nums}</div><div class="why">${why}</div></div>`;

  /* Roster context is stated, never scored. You draft best available and do not
     reach for need, so this annotates the call rather than changing it. */
  const slots = META.slots || {};
  const filled = who => rosterFill(who, slots).reduce((a,f) => a + f.got, 0);
  const now = filled(myRoster);
  const fillsSlot = r => filled(myRoster.concat([r])) > now;
  const qbShort = Math.max(0, 3 - myRoster.filter(r => r.p === "QB").length);

  const b = rec.bpa, o = rec.ours;
  const same = b.id === o.id;
  const oAlt = same ? rec.oursNext : null;

  const bpaBox = box("Best player available", b,
    num("VORP", fmt(b.v,2)) + num("Ours", fmt(b.o)) +
    (p1 ? num("@" + p1, b.s1 == null ? "—" : Math.round(b.s1*100) + "%") : ""),
    `Top of the board on VORP alone — no dynasty weighting, no roster need. ` +
    `Next: <em>${esc(rec.bpaNext.n)}</em> (${fmt(rec.bpaNext.v,2)}).`);

  const chain = r => rec.parts(r).map(([k,v]) => `${k} ${v}`).join(" × ");
  const ourBox = box("Our BPA · your rules applied", o,
    num("Score", fmt(rec.dyn(o),2)) + num("VORP", fmt(o.v,2)) +
    num("Fut", o.f == null ? "1.00" : o.f.toFixed(2)),
    `<em>VORP ${rec.parts(o).length ? "× " + chain(o) : "unadjusted"}.</em> ` +
    `Nothing else is applied: the scoring distortion and positional scarcity are ` +
    `both already inside VORP, and roster need is stated below, never scored. ` +
    (same ? `Same call as raw BPA.` +
            (oAlt ? ` Next: <em>${esc(oAlt.n)}</em> (${fmt(rec.dyn(oAlt),2)}).` : "")
          : `Ahead of <em>${esc(b.n)}</em> (${fmt(rec.dyn(b),2)}).`) +
    /* The market publishes no dynasty values for defenders, so every one of them
       carries a neutral 1.00 and can only ever lose ground on Fut. Say so when
       it actually decided the call. */
    (!same && b.f == null
      ? `<br><em>${esc(b.n)}</em> has no published dynasty value` +
        (DEF.includes(b.p) ? `, the market rates no defenders` : ``) +
        `, so he is scored on the age curve at ${ageMult(b.a).toFixed(2)} instead of Fut. ` +
        `That is a weaker signal than a traded market price, so treat the gap between ` +
        `these two as softer than it looks.` : "") +
    (rec.ctx.qbShort
      ? `<br>Short <em>${rec.ctx.qbShort} usable QB${rec.ctx.qbShort > 1 ? "s" : ""}</em>, ` +
        `${rec.ctx.qbLeft} left at or above replacement. ` +
        (rec.ctx.qbUrgent ? `<em>Supply is thinning.</em>`
                          : `Supply is deep.`) +
        ` Stated, not scored: the board is not tilted toward quarterbacks.` : "") +
    `<br>${fillsSlot(o) ? `Fills an open ${o.p} or flex slot.`
                        : `Your ${o.p} slots are covered, this is pure best available.`}`);

  const rows = OFF.concat(DEF).filter(pp => rec.paths[pp]).map(pp => {
    const r = rec.paths[pp], [fg,bg] = PC[pp];
    const s = p1 && r.s1 != null ? Math.round(r.s1*100) + "%" : "";
    return `<div class="path"><span class="p" style="color:${fg};background:${bg}">${pp}</span>` +
           `<span class="nm2" title="${esc(r.n)} · board #${r.rk}">${esc(r.n)}</span>` +
           `<span class="vv">${fmt(r.v,1)}</span>` +
           `<span class="fl" style="min-width:34px;text-align:right">${s}</span></div>`;
  }).join("");
  const pathBox = `<div class="rec"><h4>Alternate paths · best left at each position</h4>` +
    `<div class="paths">${rows}</div>` +
    `<div class="why">VORP, then the chance he lasts to ${p1 ? "#" + p1 : "your next pick"}.</div></div>`;

  $("recs").innerHTML = bpaBox + ourBox + pathBox;
}

/* The calibration behind the ranking, shown rather than asserted: what is on the
   board at each position now, what is expected to survive to your next pick, and
   the gap between them, which is the drop-off the whole ordering rests on. */
function renderCalib(drop){
  /* Set both ways, not just hidden. A one-way hide survives the flip back and
     the panel stays gone on a draft board that needs it. */
  const wrap = $("calibwrap");
  if(wrap) wrap.hidden = isWeek();
  if(isWeek()) return;
  if(drop.mode !== "live"){
    $("calib").innerHTML =
      `<div class="strip"><h3>Cost of waiting</h3><div class="mine">` +
      `No pick after this one, so there is nothing to measure waiting against. ` +
      `The <b>Now</b> column is withdrawn rather than collapsed to zero, and the board ` +
      `falls back to VORP, which is the right question when this is your last selection.` +
      `</div></div>`;
    return;
  }
  const rows = drop.calib.sort((a,b) => b.loss - a.loss).map(c => {
    const [fg,bg] = PC[c.p];
    const hot = c.loss >= 4 ? "up" : c.loss <= 1 ? "fl" : "";
    return `<tr><td class="l"><span class="p" style="color:${fg};background:${bg}">${c.p}</span></td>` +
      `<td class="l">${esc(c.best.n)}</td><td>${fmt(c.best.o)}</td>` +
      `<td class="fl">${fmt(c.later)}</td>` +
      `<td class="b ${hot}">${fmt(Math.max(0, c.loss))}</td>` +
      `<td class="fl">${c.depth}</td></tr>`;
  }).join("");

  /* Sanity anchors: on independently confirmed season VORP the best linebacker
     is worth about half the best running back, so defenders belong outside the
     top 20 and around fifteen of them inside the top 100. */
  const order = ROWS.filter(r => r.now != null).sort((a,b) => b.now - a.now);
  const inTop = n => order.slice(0, n).filter(r => DEF.includes(r.p)).length;
  const d20 = inTop(20), d50 = inTop(50), d100 = inTop(100);
  const bad = d20 > 0 || d50 > 4 || d100 > 25 || d100 < 5;
  const first = order.findIndex(r => DEF.includes(r.p)) + 1;

  $("calib").innerHTML =
    `<div class="strip"><h3>Cost of waiting &middot; measured against your pick #${drop.p1}</h3>` +
    `<table class="calib"><thead><tr><th class="l">Pos</th><th class="l">Best on the board now</th>` +
    `<th>ppg</th><th>expected at #${drop.p1}</th><th>you lose by waiting</th><th>left</th></tr></thead>` +
    `<tbody>${rows}</tbody></table>` +
    `<div class="mine" style="margin-top:9px">` +
    `<b>Sanity anchors.</b> First defender lands at <b>#${first || "none"}</b>. ` +
    `Defenders inside the top 20: <b>${d20}</b>, top 50: <b>${d50}</b>, top 100: <b>${d100}</b>. ` +
    (bad ? `<span style="color:var(--dn)">Outside the healthy range of none in the top 20, ` +
           `one or two in the top 50 and roughly fifteen in the top 100. Treat the ordering ` +
           `with suspicion.</span>`
         : `<span style="color:var(--up)">Within the expected range.</span>`) +
    `</div></div>`;
}

/* Every pick that changed hands, named. The counts alone tell you something is
   wrong but not what, and a draft with a lot of trades in it is exactly where a
   count is not enough to check against memory. */
function tradeLedger(gainedPicks, lostPicks){
  if(isWeek() || MY_ROSTER_ID == null) return "";
  const teamOf = rid => draft.names[draft.slotOf[rid]] || ("roster " + rid);
  const rdOf = n => Math.ceil(n / draft.teams);
  const line = (n, other, dir) =>
    `<span class="slot">#${n} &middot; rd ${rdOf(n)} &middot; ${dir} ${esc(other)}</span>`;
  const inRows = gainedPicks.map(n => {
    const seat = slotForPick(n, draft.teams, draft.reversal);
    return line(n, draft.names[seat] || ("slot " + seat), "from");
  });
  const outRows = lostPicks.map(n =>
    line(n, teamOf(draft.owner.get(n)), "to"));
  if(!inRows.length && !outRows.length) return "";
  return `<details class="ledger"><summary>Every pick that changed hands, ` +
    `${inRows.length} in and ${outRows.length} out</summary>` +
    (inRows.length ? `<div class="grp2">Picks you gained</div><div class="slots">${inRows.join("")}</div>` : "") +
    (outRows.length ? `<div class="grp2">Picks you gave up</div><div class="slots">${outRows.join("")}</div>` : "") +
    `<div class="mine">Read straight off Sleeper's traded-pick feed, both the draft ` +
    `endpoint and the league one, with multi-hop trades followed through to the ` +
    `team holding the pick now. If any line here is not a deal you actually made, ` +
    `the picks and survival columns on this page are built on it and are wrong.</div></details>`;
}

function renderRoster(){
  if(!ROWS.length || !META.R) return;      // the 45s poll can beat the first build
  const slots = META.slots || {};
  const fill = rosterFill(myRoster, slots);
  const label = {SUPER_FLEX:"SF", IDP_FLEX:"IDP FLEX", WRRB_FLEX:"WR/RB", REC_FLEX:"REC"};
  /* Trades are the thing most likely to be silently wrong here, so say out loud
     what the feed is being read as rather than leaving it to be discovered when
     somebody else's pick shows up on your roster. */
  const seatPicks = [];
  for(let r = 1; r <= draft.rounds; r++) seatPicks.push(pickNo(r, MY_SLOT, draft.teams, draft.reversal));
  const seatSet = new Set(seatPicks), mySet = new Set(MY_PICKS);
  const gainedPicks = MY_PICKS.filter(n => !seatSet.has(n));
  const lostPicks = seatPicks.filter(n => !mySet.has(n));
  const gained = gainedPicks.length, lost = lostPicks.length;
  const madeElsewhere = myRoster.filter(r => { const t = taken.get(r.id);
    return t && t.seat != null && t.seat !== MY_SLOT; }).length;
  const trades = MY_ROSTER_ID == null
    ? ` &middot; <span style="color:var(--hot)">draft feed unavailable, picks assumed from the snake order and trades not applied</span>`
    : (gained || lost)
      ? ` &middot; ${gained} in, ${lost} out by trade` +
        (madeElsewhere ? ` &middot; ${madeElsewhere} made from another seat` : "")
      : ` &middot; no picks traded`;

  /* MY_SLOT is a constant, so name the team it resolves to. If that is not you,
     everything on this page about your roster is wrong and you can see it here
     rather than working it out from a stranger on your bench. */
  const me = draft.names[MY_SLOT];
  $("rosterstrip").innerHTML =
    (isWeek()
      ? `<h3>Your roster &middot; ${me ? esc(me) + " &middot; " : ""}slot ${MY_SLOT}` +
        ` &middot; roster ${MY_ROSTER_ID == null ? "?" : MY_ROSTER_ID}` +
        ` &middot; week ${WEEK == null ? "?" : WEEK} &middot; ${myRoster.length} rostered` +
        ` &middot; ${myRoster.filter(r => r.onBye).length} on bye` +
        ` &middot; ${myRoster.filter(r => r.inj).length} carrying a designation</h3>`
      : `<h3>Your roster &middot; ${me ? esc(me) + " &middot; " : ""}slot ${MY_SLOT}` +
        ` &middot; roster ${MY_ROSTER_ID == null ? "?" : MY_ROSTER_ID}` +
        ` &middot; ${myRoster.length} picked &middot; ${MY_PICKS.length} picks owned${trades}</h3>`) +
    `<div class="slots">` + fill.map(f => {
      const cls = f.got >= f.need ? "full" : f.got > 0 ? "part" : "";
      return `<span class="slot ${cls}">${label[f.slot] || f.slot} ${f.got}/${f.need}</span>`;
    }).join("") + `</div>` +
    (myRoster.length
      ? `<div class="mine">` + myRoster.slice().sort((a,b) => b.v - a.v).map(r =>
          `${esc(r.n)} <span class="pk">${r.p}${r.prk} &middot; board #${r.rk} &middot; ${fmt(r.o)} ppg</span>`)
          .join(" &nbsp;·&nbsp; ") + `</div>`
      : `<div class="mine">No picks yet.</div>`) +
    tradeLedger(gainedPicks, lostPicks);

  /* Superflex needs three usable quarterbacks. Standing reminder, not a nag
     triggered by the roster being short — you asked to be prompted. */
  const qbs = myRoster.filter(r => r.p === "QB").length;
  const left = ROWS.filter(r => r.p === "QB" && !taken.has(r.id) && r.o >= META.R.QB).length;
  $("qbwarn").innerHTML = (isWeek() || qbs >= 3) ? "" :
    `<div class="banner"><span class="ic">!</span><div>` +
    `<b>Superflex: ${qbs} of 3 usable quarterbacks.</b> ` +
    `${left} QB${left === 1 ? "" : "s"} still on the board project at or above replacement ` +
    `(${META.R.QB} ppg). The league starts ${META.starts.QB} quarterbacks a week, so the ` +
    `third one is a starter, not a handcuff.</div></div>`;
}

    `<b>k = ${RULES.shrinkK} tackles and ${RULES.shrinkKGames} games are priors, not fits.</b> Tuning them properly means splitting 2025 into halves and testing which values best predict the second from the first. Sleeper's season endpoint serves totals only, so that split would cost eighteen weekly pulls on every page load. If you want it tuned, it is one constant in <code>RULES.shrinkK</code>.`,
    `<b>This is the edge, and it is an estimate.</b> Hidden value is backfilled from each player's 2025 per-tackle rate, not projected by anyone. Trust it least where it carries the most weight: median hidden share runs <b>DL ${META.hidMed.DL}%</b>, <b>DB ${META.hidMed.DB}%</b>, <b>LB ${META.hidMed.LB}%</b>, and averaged across the board the backfill is <b>DL ${META.bf.DL}%</b> of score against <b>LB ${META.bf.LB}%</b>. A defensive lineman's number is the most model and the least data.`,

    `<b>ESPN never feeds the board.</b> It is a display-only second opinion. Ours, VORP, the rules edge and every ranking come from Sleeper's projection run through your scoring. A player sitting far above his ADP is the board disagreeing with the market, which is the point of it.`,
    `<b>Survival uses sd 8</b> and this room's measured reach: rookie or 2nd year +17.9 spots early, 3rd–4th +1.8, veteran +1.3 late; by age, ≤24 +7.8, 25–27 −0.7, 28+ −2.9. Experience leads where it is known because it is the stronger signal, and the two are not added together. Roughly one pick in six misses ADP by more than five spots. The model also reads too harshly on anyone who has already slid well past his ADP and is still sitting there: it says he is nearly certain to go imminently, when in practice a player the room is actively passing on tends to keep sliding.`,
    `<b>Replacement levels are recomputed on every refresh</b> by greedy flex fill against the real <code>roster_positions</code>, offence and defence alike. Nothing here is hardcoded.`,
    `<b>FantasyPros is not wired in.</b> Their free API returns 403 and the CSV export would mean a data file, which this tool deliberately does not have. ESPN is used as a second opinion when their endpoint answers the browser's preflight; when it does not, the column simply is not there.`
  ].map(s => `<li>${s}</li>`).join("");
}

/* ------------------------------------------------------------- league view */
/* Hungarian algorithm, Jonker-Volgenant form. Minimum-cost perfect matching of
   n rows onto m >= n columns in O(n^2 m). Returns row -> column, 1-indexed. */
function hungarian(a, n, m){
  const INF = Infinity;
  const u = new Float64Array(n + 1), v = new Float64Array(m + 1);
  const p = new Int32Array(m + 1), way = new Int32Array(m + 1);
  for(let i = 1; i <= n; i++){
    p[0] = i;
    let j0 = 0;
    const minv = new Float64Array(m + 1).fill(INF);
    const used = new Uint8Array(m + 1);
    do{
      used[j0] = 1;
      const i0 = p[j0];
      let delta = INF, j1 = 0;
      for(let j = 1; j <= m; j++) if(!used[j]){
        const cur = a[i0 - 1][j - 1] - u[i0] - v[j];
        if(cur < minv[j]){ minv[j] = cur; way[j] = j0; }
        if(minv[j] < delta){ delta = minv[j]; j1 = j; }
      }
      for(let j = 0; j <= m; j++){
        if(used[j]){ u[p[j]] += delta; v[j] -= delta; }
        else minv[j] -= delta;
      }
      j0 = j1;
    } while(p[j0] !== 0);
    do{ const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while(j0);
  }
  const row = new Int32Array(n + 1);
  for(let j = 1; j <= m; j++) if(p[j]) row[p[j]] = j;
  return row;
}

/* Fill one roster into the real starting slots. This is a true assignment, not
   a greedy pass: greedy fills dedicated slots first, so a DL/LB defender gets
   consumed by a DL slot and can leave the LB slot with someone far worse.

   Cost is -(BIG + points - streamed), which orders the objective
   lexicographically. BIG dominates, so every eligible player beats an empty slot
   and the lineup fills as many slots as the roster legally can. The remainder is
   what a slot gains over streaming it, which makes the second objective the
   projected total itself rather than just the points of the players placed.
   Without that term the assignment is indifferent between putting a lone
   receiver in the superflex, leaving the flex to stream at 14.2, and putting him
   in the flex, leaving the superflex to stream at 19.9. */
const LINEUP_BIG = 1e5;
/* fillFirst is the difference between a draft and a week, and getting it wrong
   starts a player on his bye.

   In a draft, filling a slot dominates: an empty slot means you own nobody there
   and the replacement level is a placeholder for a player you have yet to
   acquire, so any real body beats it. In a week, the replacement level is a
   player you could literally add off waivers this afternoon, so a rostered
   player only belongs in the lineup if he outscores that. A man on a bye scores
   zero, and zero does not outscore streaming. */
function lineupFor(roster, slots, repl, key, fillFirst){
  const BIG = fillFirst === false ? 0 : LINEUP_BIG;
  const K = key || "o";
  const val = r => r[K] == null ? 0 : r[K];
  const out = [];
  const push = (slot, takes) => out.push({slot, takes, r:null,
    /* An empty slot is not zero points: you stream the best freely available body
       at that position, which is exactly what replacement level measures. */
    fa: Math.max(...takes.map(p => repl[p] ?? 0))});
  for(const b of OFF.concat(DEF))
    for(let i = 0; i < (slots[b]||0); i++) push(b, [b]);
  for(const [slot, takes] of Object.entries(FLEX_TAKES))
    for(let i = 0; i < (slots[slot]||0); i++) push(slot, takes);
  const n = out.length, P = roster.length;
  const seat = new Set();
  if(n && P){
    /* m = P + n so every slot always has a private zero-cost column to sit out
       on, which keeps the matching perfect without ever blocking a player. */
    const m = P + n, a = [];
    for(let i = 0; i < n; i++){
      const row = new Float64Array(m);
      for(let j = 0; j < P; j++)
        if(roster[j].elig.some(p => out[i].takes.includes(p)))
          row[j] = -(BIG + val(roster[j]) - out[i].fa);
      a.push(row);
    }
    const asg = hungarian(a, n, m);
    for(let i = 1; i <= n; i++){
      const j = asg[i] - 1;
      if(j >= 0 && j < P && a[i - 1][j] < 0){ out[i - 1].r = roster[j]; seat.add(j); }
    }
  }
  return {lineup:out, bench:roster.filter((_,j) => !seat.has(j))};
}

/* One column per slot type in the order the lineup is built, so the columns are
   the 19 slots spaced out rather than seven position groups with the flex
   starters folded back in. Built from the league's real roster_positions. */
function slotKeys(){
  const s = META.slots || {};
  return OFF.concat(DEF).filter(b => s[b] > 0)
    .concat(Object.keys(FLEX_TAKES).filter(k => s[k] > 0));
}

/* Age, three ways, because they answer three different questions.

   Starter age is weighted by points, not by headcount. An unweighted mean over
   the lineup lets a 34 year old kicking out 13 ppg drag the number as hard as
   the 28 year old carrying 30, which is not what anyone means by "how old is
   this team". Weighting says how old the POINTS are.

   Roster age is a plain mean over everyone rostered, because as a dynasty asset
   base every body counts once regardless of what he scores this year.

   Young share is the fraction of starting points coming from 26 and under,
   which is the one that actually separates a contender from an ageing one:
   two teams can share an average age and have completely different futures.

   Streamed slots have no age and are left out of all three, since a replacement
   level is a number rather than a person. Coverage is reported so a team with
   half its ages missing cannot pass as precise. */
function ages(lineup, roster){
  const started = lineup.filter(x => x.r);
  const known = started.filter(x => x.r.a != null);
  const w = known.reduce((a,x) => a + Math.max(0, x.r.o), 0);
  const ageW = w > 0
    ? +(known.reduce((a,x) => a + x.r.a * Math.max(0, x.r.o), 0) / w).toFixed(1) : null;
  const young = known.filter(x => x.r.a <= 26).reduce((a,x) => a + Math.max(0, x.r.o), 0);
  const rAges = roster.filter(r => r.a != null).map(r => r.a);
  return {
    ageW,
    ageR: rAges.length ? +(rAges.reduce((a,b) => a + b, 0) / rAges.length).toFixed(1) : null,
    u26: w > 0 ? Math.round(100 * young / w) : null,
    ageN: known.length, ageOf: started.length,
    ageRn: rAges.length, ageRof: roster.length
  };
}

function leagueTable(){
  if(!ROWS.length || !META.R) return null;
  const slots = META.slots || {}, repl = META.R;
  const byId = new Map(ROWS.map(r => [r.id, r]));
  const keys = slotKeys();
  const teams = [];
  for(let sl = 1; sl <= draft.teams; sl++){
    const roster = [];
    for(const [pid, t] of taken) if(t.slot === sl && byId.has(pid)) roster.push(byId.get(pid));
    const {lineup, bench} = lineupFor(roster, slots, repl, "o", !isWeek());
    const starters = lineup.filter(x => x.r).length;
    const total = lineup.reduce((a,x) => a + (x.r ? x.r.o : x.fa), 0);
    const real = lineup.reduce((a,x) => a + (x.r ? x.r.o : 0), 0);
    /* The same roster, assigned and scored on Sleeper's own numbers. Its own
       optimal lineup rather than ours, because a manager reading Sleeper would
       field the lineup Sleeper's numbers imply. Doing it any other way mixes the
       invisible value in with a lineup disagreement and the edge stops being a
       clean number. */
    const sl2 = lineupFor(roster, slots, META.Rsleep || repl, "sleep", !isWeek()).lineup;
    const sleeper = sl2.reduce((a,x) => a + (x.r ? (x.r.sleep ?? 0) : x.fa), 0);
    /* Every slot counts under its own column, replacement filler included, so the
       columns add up to the headline number rather than to some subset of it. */
    const bySlot = {};
    for(const k of keys) bySlot[k] = 0;
    for(const x of lineup) if(bySlot[x.slot] != null) bySlot[x.slot] += x.r ? x.r.o : x.fa;
    for(const k of keys) bySlot[k] = +bySlot[k].toFixed(1);
    const rid = asRid((draft.slots || {})[String(sl)]);
    const mu = rid != null ? MATCHUPS.get(rid) : null;
    const oppSlot = mu && mu.opp != null ? slotOfRoster(mu.opp) : null;
    teams.push(Object.assign(ages(lineup, roster),
               {slot:sl, name:draft.names[sl] || ("slot " + sl), roster, lineup, bench,
                oppName: oppSlot ? (draft.names[oppSlot] || "slot " + oppSlot) : null,
                sleepLineup:sl2, starters, slotCount:lineup.length, total:+total.toFixed(1),
                sleeper:+sleeper.toFixed(1), edge:+(total - sleeper).toFixed(1),
                real:+real.toFixed(1), fa:+(total-real).toFixed(1), bySlot, mine:sl === MY_SLOT}));
  }
  teams.sort((a,b) => b.total - a.total);
  teams.forEach((t,i) => t.rank = i + 1);
  /* Where the room would have them, which is the whole point of showing it. */
  teams.slice().sort((a,b) => b.sleeper - a.sleeper).forEach((t,i) => t.srank = i + 1);
  const avg = teams.reduce((a,t) => a + t.total, 0) / (teams.length || 1);
  const savg = teams.reduce((a,t) => a + t.sleeper, 0) / (teams.length || 1);
  teams.forEach(t => t.vsAvg = +(t.total - avg).toFixed(1));
  /* League age is the mean of the twelve team figures, not a re-pool of every
     player: each team counts once, which is what "younger than the league"
     means when you are comparing yourself to eleven other managers. */
  const mean = f => { const v = teams.map(f).filter(x => x != null);
                      return v.length ? +(v.reduce((a,b) => a + b, 0) / v.length).toFixed(1) : null; };
  return {teams, avg:+avg.toFixed(1), savg:+savg.toFixed(1),
          ageW: mean(t => t.ageW), ageR: mean(t => t.ageR), u26: mean(t => t.u26)};
}

/* Every column pivots, same as the board. */
let LSORT = {k:"total", dir:-1};
function leagueCols(){
  return [
    {k:"rank",  h:"#",         get:t => t.rank, dir:1,
     tip:"Rank by projected points per week. Stays put when you sort by something else."},
    {k:"name",  h:"Team",      get:t => t.name.toLowerCase(), dir:1, cls:"l",
     tip:"Click any row for that team's full lineup."},
    {k:"start", h:"Starters",  get:t => t.starters, dir:-1,
     tip:isWeek()
       ? "How many starting slots are worth filling from the roster this week. The rest are ones where nobody rostered beats the best freely available player, so they are adds rather than holes."
       : "How many of the 19 starting slots the roster can actually fill right now."},
    {k:"total", h:isWeek() ? "Proj" : "Proj ppg",  get:t => t.total, dir:-1,
     tip:isWeek()
       ? "Sum of this week's projections across the starting slots, empty slots counted at replacement level. Points for the week, not a rate."
       : "Sum of Ours across the 19 starting slots, empty slots counted at replacement level."},
    {k:"sleep", h:"Sleeper",   get:t => t.sleeper, dir:-1,
     tip:"The same roster scored on Sleeper's own projection under this league's rules, with nothing backfilled. What the rest of the room sees when it looks at this team. Its own optimal lineup, not ours, because a manager reading Sleeper would field the lineup Sleeper's numbers imply. The small number is where the room would rank them."},
    {k:"agew",  h:"Age",       get:t => t.ageW == null ? 999 : t.ageW, dir:1,
     tip:"Average age of the starting lineup, weighted by points. Weighted rather than a headcount mean, because an unweighted average lets a 34 year old scraping 13 ppg drag the number as hard as the 28 year old carrying 30. This says how old the points are. Streamed slots have no age and are left out."},
    {k:"ager",  h:"Roster",    get:t => t.ageR == null ? 999 : t.ageR, dir:1,
     tip:"Average age of every player rostered, starter or not, counted once each. The dynasty asset base rather than this week's lineup."},
    {k:"u26",   h:"U26",       get:t => t.u26 == null ? -1 : t.u26, dir:-1,
     tip:"Share of the starting lineup's points coming from players 26 and under. Two teams can share an average age and have completely different futures, and this is the number that separates them."},
    {k:"edge",  h:"Hidden",    get:t => t.edge, dir:-1,
     tip:"Proj ppg minus Sleeper: the value on this roster the draft interface cannot see. Almost all of it is defensive, because Sleeper projects no pass defended, no TFL and no QB hits, worth 3, 2 and 1 point here. A team high on this list is stronger than the room thinks it is."},
    {k:"fa",    h:"from FA",   get:t => t.fa, dir:-1,
     tip:"How much of that total is replacement-level filler for slots the roster cannot fill."},
    {k:"vs",    h:"vs avg",    get:t => t.vsAvg, dir:-1,
     tip:"Projected points per week above or below the league average."}
  ].concat(isWeek() ? [{k:"opp", h:"Opp", get:t => (t.oppName || "zzz").toLowerCase(), dir:1, cls:"l",
     tip:"This week's opponent, from the league matchups endpoint. Sort by it to line the two halves of each matchup up next to each other."}] : [])
   .concat(slotKeys().map(s => {
    const n = (META.slots||{})[s], takes = FLEX_TAKES[s];
    return {k:"s:"+s, h:SLOT_COL[s] || s, get:t => t.bySlot[s], dir:-1,
      tip:`${n} ${SLOT_LABEL[s] || s} slot${n === 1 ? "" : "s"}` +
          (takes ? `, any of ${takes.join("/")}` : "") +
          `. Empty slots count at replacement level, so every column here adds up to Proj ppg.`};
  }));
}

function renderLeague(){
  const L = leagueTable();
  if(!L || !L.teams.length){ $("league").innerHTML = ""; return; }
  const cols = leagueCols(), keys = slotKeys();
  const sc = cols.find(c => c.k === LSORT.k) || cols[3];
  const teams = L.teams.slice().sort((a,b) => {
    const x = sc.get(a), y = sc.get(b);
    return (x < y ? -1 : x > y ? 1 : 0) * LSORT.dir;
  });
  const head = `<tr>` + cols.map(c =>
    `<th class="${c.cls || ""}${LSORT.k === c.k ? " on" : ""}" data-k="${c.k}" title="${esc(c.tip)}">` +
    `${c.h}${LSORT.k === c.k ? (LSORT.dir < 0 ? " ↓" : " ↑") : ""}</th>`).join("") + `</tr>`;
  const body = teams.map(t =>
    `<tr class="${t.mine ? "own" : ""}" data-team="${t.slot}">` +
    `<td>${t.rank}</td><td class="l"><span class="nm">${esc(t.name)}</span>` +
    (t.mine ? '<span class="gl you">you</span>' : "") + `</td>` +
    `<td class="${t.starters < t.slotCount ? "dn" : "up"}">${t.starters}/${t.slotCount}</td>` +
    `<td class="b">${fmt(t.total)}</td>` +
    `<td class="fl">${fmt(t.sleeper)}<span class="srk">#${t.srank}</span></td>` +
    /* Younger is the direction this manager drafts, so green is young. */
    `<td class="${t.ageW == null ? "fl" : t.ageW <= L.ageW - 0.6 ? "up" : t.ageW >= L.ageW + 0.6 ? "dn" : "fl"}"` +
    ` title="${t.ageN} of ${t.ageOf} starters carry an age">${fmt(t.ageW)}</td>` +
    `<td class="fl" title="${t.ageRn} of ${t.ageRof} rostered players carry an age">${fmt(t.ageR)}</td>` +
    `<td class="${t.u26 == null ? "fl" : t.u26 >= 60 ? "up" : t.u26 <= 35 ? "dn" : "fl"}">` +
    `${t.u26 == null ? "—" : t.u26 + "%"}</td>` +
    `<td class="${t.edge > 0 ? "up" : t.edge < 0 ? "dn" : "fl"}">` +
    `${t.edge > 0 ? "+" : ""}${fmt(t.edge)}</td>` +
    `<td class="fl">${t.fa > 0 ? fmt(t.fa) : "—"}</td>` +
    `<td class="${t.vsAvg > 0 ? "up" : t.vsAvg < 0 ? "dn" : "fl"}">${t.vsAvg > 0 ? "+" : ""}${fmt(t.vsAvg)}</td>` +
    (isWeek() ? `<td class="l fl">${t.oppName ? esc(t.oppName) : "—"}</td>` : "") +
    keys.map(s => `<td class="${t.lineup.some(x => x.slot === s && !x.r) ? "dn" : "fl"}">` +
                  `${fmt(t.bySlot[s])}</td>`).join("") +
    `</tr>`).join("");
  $("league").innerHTML =
    `<table class="calib lg" style="width:100%">${head}${body}</table>` +
    `<div class="mine" style="margin-top:9px">` +
    `<b>Sleeper</b> is the same roster scored on Sleeper's own projection under this league's ` +
    `rules with nothing backfilled, which is what the rest of the room sees, and the small ` +
    `number beside it is where the room would rank that team. It gets its own optimal lineup ` +
    `rather than ours, because a manager reading Sleeper would field the lineup Sleeper's ` +
    `numbers imply. <b>Hidden</b> is the difference, and it is almost entirely defensive: ` +
    `Sleeper projects no pass defended, no TFL and no QB hits, worth 3, 2 and 1 point here. ` +
    `A team high on Hidden is stronger than the room thinks. League average on their numbers ` +
    `is <b>${fmt(L.savg)}</b> against <b>${fmt(L.avg)}</b> on ours.<br><br>` +
    `<b>Age</b> is the starting lineup weighted by points rather than by headcount, so it says ` +
    `how old the points are: an unweighted mean lets a 34 year old scraping 13 ppg drag the ` +
    `number as hard as the 28 year old carrying 30. <b>Roster</b> is a plain mean over everyone ` +
    `rostered, the dynasty asset base rather than this week's lineup. <b>U26</b> is the share of ` +
    `starting points from players 26 and under, which is the one that separates two teams that ` +
    `share an average age and have completely different futures. League-wide: starters ` +
    `<b>${fmt(L.ageW)}</b>, rosters <b>${fmt(L.ageR)}</b>, ` +
    `<b>${L.u26 == null ? "—" : Math.round(L.u26) + "%"}</b> under 26. Green is younger than the league, ` +
    `red older. Streamed slots have no age and are left out of all three.<br><br>` +
    `League average <b>${fmt(L.avg)}</b> points per week ` +
    `across the ${L.teams[0].slotCount}-slot lineup${isWeek() ? ", for week " + (WEEK || "?") : ""}. ` +
    `Every slot type has its own column and all ` +
    `${keys.length} of them add up to <b>${isWeek() ? "Proj" : "Proj ppg"}</b> exactly. ` +
    (isWeek()
      ? `A slot counts at replacement level when nobody on the roster beats the best freely ` +
        `available player there, which makes it an add rather than a hole. <b>Any column shown ` +
        `in red is carrying some of that</b>, and <b>from FA</b> totals it. Lineups maximise ` +
        `points outright, so a rostered player starts only when he beats what his manager could ` +
        `stream this afternoon, which is why nobody on a bye appears in one.`
      : `Empty slots are filled at replacement level, the best freely available player at that ` +
        `position, so a thin roster is scored on what it could stream rather than on zero. ` +
        `<b>Any column shown in red is carrying some of that filler</b>, and <b>from FA</b> is ` +
        `the total of it across the lineup. Lineups are a true optimal assignment rather than a ` +
        `greedy fill, so the best legal arrangement of a roster is always the one shown and ` +
        `nobody on the bench outscores a starter he could legally replace.`) +
    ` Every column sorts. Click a team for its lineup.</div>`;
}

function openTeamCard(slot){

  const t = L.teams.find(x => x.slot === slot); if(!t) return;
  const label = s => SLOT_LABEL[s] || s;
  /* Sleeper's number for the same player alongside ours, and what it hides. */
  const cell = (v, cls) => `<td class="${cls||""}">${fmt(v)}</td>`;
  const rows = t.lineup.map(x => {
    const hid = x.r ? +(x.r.o - (x.r.sleep ?? x.r.o)).toFixed(1) : 0;
    return `<tr><td class="l fl">${label(x.slot)}</td>` +
    (x.r
      ? `<td class="l"><span class="nm">${esc(x.r.n)}</span>` +

    `&middot; ${fmt(t.total)} projected ppg &middot; ` +
    `${t.vsAvg > 0 ? "+" : ""}${fmt(t.vsAvg)} vs league average &middot; ` +

    `${fmt(L.ageW)} &middot; whole roster <b>${fmt(t.ageR)}</b> against ${fmt(L.ageR)} ` +
    `&middot; <b>${t.u26 == null ? "—" : t.u26 + "%"}</b> of starting points from 26 and under, ` +
    `league ${L.u26 == null ? "—" : Math.round(L.u26) + "%"}` +
    (t.ageN < t.ageOf ? ` &middot; <span class="dn">${t.ageOf - t.ageN} starter` +
      `${t.ageOf - t.ageN === 1 ? "" : "s"} carry no age</span>` : "") + `</div>` +
    `<table><tr><th class="l">Slot</th><th class="l">Player</th><th class="l">Pos</th>` +
    `<th class="l">Tm</th><th>Age</th><th>Ours</th><th>Sleeper</th><th>Hidden</th></tr>${rows}` +
    `<tr class="tot"><td class="l">Total</td><td></td><td></td><td></td>` +
    `<td>${fmt(t.ageW)}</td>` +
    `<td>${fmt(t.total)}</td><td>${fmt(t.sleeper)}</td>` +
    `<td class="${t.edge > 0 ? "up" : "fl"}">${t.edge > 0 ? "+" : ""}${fmt(t.edge)}</td></tr></table>` +
    (bench ? `<div class="grp">Bench, best first</div><div class="why2" style="border:none;padding-top:4px">${bench}</div>` : "") +
    `<div class="why2">` +
    (isWeek()
      ? `A slot marked streamed is one where nobody you roster beats the best freely available ` +
        `player, so it is an add rather than a lineup choice. `
      : `Empty slots score at replacement level rather than zero, on the basis ` +
        `that anyone can stream the best free body at that position. `) +
    `<b>${fmt(t.fa)} of the ${fmt(t.total)}</b> total is that filler. ` +
    `This lineup is a true optimal assignment across all ${t.slotCount} slots, using full ` +
    `position eligibility so a DL/LB can take either. ` +
    (isWeek()
      ? `It maximises points outright: a rostered player starts only when he beats what you ` +
        `could stream at that slot this afternoon, which is why a man on his bye sits even ` +
        `though he would fill the slot. No rearrangement of these ${t.roster.length} players ` +
        `scores higher.`
      : `It fills as many slots as the roster legally can and then maximises points inside ` +
        `that, which means no rearrangement of these ${t.roster.length} players scores higher ` +
        `and nobody on the bench outscores a starter he could legally replace.`) + `<br><br>` +
    `The <b>Sleeper</b> column is each player scored on Sleeper's own projection under this ` +
    `league's rules with nothing backfilled, and <b>Hidden</b> is what the draft interface ` +
    `cannot see on him. The column total is not the sum of the rows: Sleeper's numbers imply ` +
    `their own optimal lineup, which is the one totalled, and it need not be this one.</div>`;
  $("cardwrap").hidden = false;
  $("cardclose").onclick = closeCard;
}

/* ------------------------------------------------------------- player card */
const STAT_LABEL = {
  pass_yd:"Pass yards", pass_td:"Pass TD", pass_int:"Interception", pass_cmp:"Completion",
  pass_inc:"Incompletion", pass_att:"Pass attempt", pass_2pt:"Pass 2PC", pass_int_td:"Pick six",
  pass_cmp_40p:"40+ completion", pass_td_40p:"40+ pass TD",
  rush_yd:"Rush yards", rush_td:"Rush TD", rush_att:"Carry", rush_fd:"Rush first down",
  rush_2pt:"Rush 2PC", rush_40p:"40+ rush", rush_td_40p:"40+ rush TD",
  rec:"Reception", rec_yd:"Rec yards", rec_td:"Rec TD", rec_fd:"Rec first down",
  bonus_rec_te:"TE reception bonus", rec_2pt:"Rec 2PC", rec_40p:"40+ reception",
  rec_td_40p:"40+ rec TD",
  fum:"Fumble", fum_lost:"Fumble lost", fum_rec_td:"Fumble rec TD",
  kr_yd:"Kick return yards", pr_yd:"Punt return yards",
  st_tkl_solo:"ST solo tackle", st_ff:"ST forced fumble", st_fum_rec:"ST fumble rec", st_td:"ST TD",
  idp_tkl_solo:"Solo tackle", idp_tkl_ast:"Assist", idp_sack:"Sack", idp_tkl_loss:"TFL",
  idp_qb_hit:"QB hit", idp_pass_def:"Pass defended", idp_int:"Interception",
  idp_int_ret_yd:"INT return yards", idp_ff:"Forced fumble", idp_fum_rec:"Fumble recovery",
  idp_fum_ret_yd:"Fumble return yards", idp_safe:"Safety", idp_blk_kick:"Blocked kick",
  idp_td:"Defensive TD"
};
const SRC_LABEL = {
  sleeper:"Sleeper projected it",
  shrunk:"we estimated it, rate shrunk to the positional mean",
  rate:"we estimated it from his 2025 per-tackle rate",
  prorated:"we prorated his 2025 per-game rate"
};

function openCard(id){
  const r = ROWS.find(x => x.id === id);
  if(!r) return;
  const line = r.line || {}, src = r.src || {}, gp = r.gp || 1;

  /* Rebuild the score one line at a time, in exactly the order score() walks the
     table, so the total on screen is the total the engine used. */
  const rows = [];
  for(const k in SC){
    const m = SC[k];
    if(!m) continue;
    let qty;
    if(k === "pass_inc") qty = Math.max(0, (line.pass_att||0) - (line.pass_cmp||0));
    else if(k === "bonus_rec_te") qty = r.p === "TE" ? (line.rec||0) : 0;
    else qty = line[k] || 0;
    if(!qty) continue;
    const from = k === "pass_inc" ? (src.pass_att || "sleeper") : (src[k] || "sleeper");
    rows.push({k, qty, m, pts:qty * m, from});
  }
  rows.sort((a,b) => Math.abs(b.pts) - Math.abs(a.pts));
  const total = rows.reduce((a,x) => a + x.pts, 0);
  const ours = rows.filter(x => x.from !== "sleeper").reduce((a,x) => a + x.pts, 0);

  const used = [...new Set(rows.map(x => x.from))];
  const key = used.map(u =>
    `<span class="s-${u}"><span class="sq bg-${u}"></span>${SRC_LABEL[u]}</span>`).join(" &nbsp; ");

  const body = rows.map(x =>
    `<tr class="s-${x.from}"><td class="l"><span class="sq bg-${x.from}"></span>${STAT_LABEL[x.k] || x.k}</td>` +
    `<td>${x.qty.toFixed(x.qty < 10 ? 2 : 1)}</td><td class="fl">x ${x.m}</td>` +
    `<td>${x.pts.toFixed(1)}</td><td>${(x.pts/gp).toFixed(2)}</td></tr>`).join("");

  let deriv = "";
  if(r.rates){
    const pt = (line.idp_tkl_solo||0) + (line.idp_tkl_ast||0);
    deriv = `<div class="grp">How the estimated defensive stats were built</div>` +
      `<table><tr><th class="l">Stat</th><th class="l">per</th><th>his 2025 rate</th>` +
      `<th>${r.p} mean</th><th>weight</th><th>blend</th><th>x</th><th>result</th></tr>` +
      BACKFILL_RATE.map(k => {
        const wk = r.rates.w[k];
        const bl = wk * r.rates.raw[k] + (1 - wk) * r.rates.lg[k];
        const per = r.rates.per[k], mult = per === "tackle" ? pt : gp;
        return `<tr><td class="l">${STAT_LABEL[k]}</td><td class="l fl">${per}</td>` +
          `<td>${r.rates.raw[k]}</td><td class="fl">${r.rates.lg[k]}</td>` +
          `<td>${Math.round(wk*100)}% his</td><td>${bl.toFixed(4)}</td>` +
          `<td class="fl">${mult.toFixed(0)} ${per === "tackle" ? "tkl" : "gm"}</td>` +
          `<td>${(bl * mult).toFixed(1)}</td></tr>`;
      }).join("") + `</table>` +
      `<div class="why2">Blend is <code>w x his rate + (1 - w) x the ${r.p} mean</code>. ` +
      `<b>The denominator differs by stat.</b> Pass defended tracks tackle volume, so it uses ` +
      `<code>w = ${r.rates.n} tackles / (${r.rates.n} + ${RULES.shrinkK})</code>. TFL and QB hits ` +
      `track snaps rather than tackles, so they use <code>w = ${r.rates.g} games / ` +
      `(${r.rates.g} + ${RULES.shrinkKGames})</code>. Shrinking a pass rusher's TFL by his tackle ` +
      `count would drag a full season halfway to average purely because edge players do not ` +
      `rack up tackles. Sleeper projects none of these three, which is the entire edge.</div>`;
  }

  $("card").innerHTML =
    `<button id="cardclose">Close</button>` +
    `<h2>${esc(r.n)}</h2>` +
    `<div class="sub2">${r.p}${r.prk} &middot; ${esc(r.t)} &middot; age ${r.a ?? "?"} &middot; ` +
    `board #${r.iadp} &middot; ${gp} projected games &middot; ${r.ag || 0} games in 2025</div>` +
    `<div class="why2" style="border:none;margin:0 0 10px;padding:0">${key}</div>` +
    `<table><tr><th class="l">Stat</th><th>projected</th><th>points each</th>` +
    `<th>season</th><th>per game</th></tr>${body}` +
    `<tr class="tot"><td class="l">Total</td><td></td><td></td>` +
    `<td>${total.toFixed(1)}</td><td>${(total/gp).toFixed(2)}</td></tr></table>` +
    `<div class="why2"><b>Ours = ${(total/gp).toFixed(2)} ppg</b>, which is ` +
    `${total.toFixed(1)} season points divided by ${gp} projected games. ` +
    `Of that, <b>${(ours/gp).toFixed(2)} ppg comes from stats we estimated</b> rather than ones ` +
    `Sleeper published, which is what the Hidden column reports and what the rest of your ` +
    `league cannot see.</div>` + deriv;

  $("cardwrap").hidden = false;
  $("cardclose").onclick = closeCard;
}
function closeCard(){ $("cardwrap").hidden = true; }
$("cardbg").onclick = closeCard;
addEventListener("keydown", e => { if(e.key === "Escape") closeCard(); });
$("tb").addEventListener("click", e => {
  const tr = e.target.closest("tr");

/* -------------------------------------------------------------------- poll */
function setFeed(state, text){
  $("v-dot").className = "dot" + (state === "live" ? "" : state === "warn" ? " warn" : " off");
  $("v-feed").textContent = text;
}

async function poll(){
  if(!draft.id) return;
  /* In season the rosters endpoint owns the truth and the picks feed is months
     stale, so polling it would undo every waiver and trade on a 45s timer. */
  if(isWeek()) return pollWeek();
  try{
    const picks = await jget(`https://api.sleeper.app/v1/draft/${draft.id}/picks`);
    made = picks.length;
    taken = new Map();
    for(const p of picks){
      if(!p.player_id) continue;
      const rid = ownerOf(p);
      taken.set(String(p.player_id),
                {rid, slot: slotOfRoster(rid) || p.draft_slot, seat: p.draft_slot, pick: p.pick_no});
    }
    myRoster = ROWS.filter(r => isMine(taken.get(r.id)));

    const next = MY_PICKS.find(n => n > made) || null, away = next ? next - made : 0;
    const done = made >= draft.teams * draft.rounds;
    const nextNo = made + 1;
    /* The team on the clock is whoever OWNS the pick, not whoever sits in the
       seat it is made from. Those are the same team until someone trades. */
    const seat = slotForPick(nextNo, draft.teams, draft.reversal);
    const onClock = slotOfRoster(draft.owner.get(nextNo)) || seat;
    $("v-made").textContent = made;
    $("v-clock").textContent = done ? "draft over"
      : `#${nextNo} · ${draft.names[onClock] || "slot " + onClock}` +
        (onClock !== seat ? ` (from ${draft.names[seat] || "slot " + seat})` : "");
    $("v-next").textContent = next ? "#" + next : "done";
    const el = $("v-away");
    el.textContent = next ? away : "—";
    el.className = "v" + (next && away <= 3 ? " hot" : "");
    lastPoll = new Date(); feedOk = true;
    setFeed("live", "live " + lastPoll.toLocaleTimeString());
    $("stalewarn").innerHTML = "";
    renderRoster(); render();
  }catch(e){
    feedOk = false;
    setFeed("off", "offline");
    $("stalewarn").innerHTML =
      `<div class="warn">Sleeper's draft feed is not answering (${esc(e.message)}). The board below is ` +
      `still live and fully scored, it just cannot mark who has been drafted` +
      (lastPoll ? ` — picks shown are as of ${lastPoll.toLocaleTimeString()}` : "") +
      `. Retrying every ${POLL_MS / 1000}s.</div>`;
  }
}

function weekHeader(){
  const m = MY_ROSTER_ID != null ? MATCHUPS.get(MY_ROSTER_ID) : null;
  const oppSlot = m && m.opp != null ? slotOfRoster(m.opp) : null;
  const lbl = (el, t) => { if(el && el.previousElementSibling) el.previousElementSibling.textContent = t; };
  $("v-made").textContent = WEEK == null ? "—" : WEEK;
  lbl($("v-made"), "Week");
  const clk = $("v-clock"), nxt = $("v-next"), awy = $("v-away");
  clk.textContent = oppSlot ? (draft.names[oppSlot] || "slot " + oppSlot) : "no matchup";
  lbl(clk, "Opponent");
  nxt.textContent = myRoster.length || "—";
  lbl(nxt, "Rostered");
  awy.textContent = BYE.size || "0";
  lbl(awy, "Teams on bye");
  awy.className = "v";
}

/* Rosters move on waivers and trades, so they are re-read on the same timer the
   draft board used for picks. Projections are not re-pulled here: they move on
   Sleeper's schedule rather than minute to minute, and Refresh does that. */
async function pollWeek(){
  try{
    weekHeader();
    const rosters = await jget(`https://api.sleeper.app/v1/league/${LEAGUE}/rosters`);
    const next = new Map(); const seen = new Set();
    for(const r of rosters){
      const rid = asRid(r.roster_id);
      if(rid == null) continue;
      for(const pid of (r.players || [])){
        next.set(String(pid), {rid, slot: slotOfRoster(rid), seat: null, pick: null});
        seen.add(String(pid));
      }
    }
    if(!next.size) throw new Error("rosters empty");
    taken = next; ROSTERED = seen;
    myRoster = ROWS.filter(r => isMine(taken.get(r.id)));
    lastPoll = new Date(); feedOk = true;
    setFeed("live", "rosters " + lastPoll.toLocaleTimeString());
    $("stalewarn").innerHTML = "";
    renderRoster(); render();
  }catch(e){
    feedOk = false;
    setFeed("off", "roster feed offline");
  }
}

/* -------------------------------------------------------------------- load */
async function loadAll(opts){
  opts = opts || {};
  if(busy) return;
  busy = true;
  const btn = $("refresh");
  btn.disabled = true; btn.textContent = "Refreshing…";
  try{
    const league = await jget(`https://api.sleeper.app/v1/league/${LEAGUE}`);
    SC = league.scoring_settings;
    draft.id = league.draft_id;
    const slots = slotCounts(league.roster_positions);
    draft.teams = league.total_rosters || 12;

    /* Which week it is comes from Sleeper, never from a constant, so the page is
       correct on Tuesday morning without anyone editing it. Falls back to the
       season board if the state endpoint is unreachable, because a wrong week is
       worse than no week. */
    if(isWeek()){
      const st = await jget("https://api.sleeper.app/v1/state/nfl").catch(() => null);
      if(st){
        SEASON_TYPE = st.season_type === "post" ? "post" : "regular";
        WEEK = st.display_week || st.week || st.leg || null;
      }
      if(!WEEK){ MODE = "draft"; }
    }
    const WK = WEEK;

    const [P, proj, prior, fcalc, dObj, tpDraft, tpLeague, users, rosters, matchups] = await Promise.all([
      loadPlayers(opts.hardPlayers),
      isWeek()
        ? jget(`https://api.sleeper.app/v1/projections/nfl/${SEASON_TYPE}/${SEASON}/${WK}`)
            .catch(() => jget(`https://api.sleeper.app/v1/projections/nfl/regular/${SEASON}/${WK}`))
        : jget(`https://api.sleeper.app/v1/projections/nfl/regular/${SEASON}`),
      jget(`https://api.sleeper.app/v1/stats/nfl/regular/${PRIOR}`),
      jget("https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=2&numTeams=12&ppr=1").catch(() => []),
      jget(`https://api.sleeper.app/v1/draft/${draft.id}`).catch(() => null),
      /* Both traded-pick endpoints, merged. The draft one carries trades made
         inside the draft room, the league one carries everything traded before
         it including future seasons. Either can be the only one that knows about
         a given deal, and a missed deal silently mis-assigns a pick, so this
         takes the union and lets the season filter and the chain walk sort it
         out rather than trusting one endpoint to be complete. */
      jget(`https://api.sleeper.app/v1/draft/${draft.id}/traded_picks`).catch(() => []),
      jget(`https://api.sleeper.app/v1/league/${LEAGUE}/traded_picks`).catch(() => []),
      jget(`https://api.sleeper.app/v1/league/${LEAGUE}/users`).catch(() => []),
      /* In season the roster is the truth, not the draft picks feed: waivers,
         trades and drops have all happened since. */
      isWeek() ? jget(`https://api.sleeper.app/v1/league/${LEAGUE}/rosters`).catch(() => []) : [],
      isWeek() && WK ? jget(`https://api.sleeper.app/v1/league/${LEAGUE}/matchups/${WK}`).catch(() => []) : []
    ]);
    PLAYERS = P;

    /* Byes, derived rather than looked up: Sleeper publishes no bye table on v1,
       but a team with nobody in this week's projections is not playing. Guarded
       by a sanity floor, because an empty or half-loaded projection payload
       would otherwise mark the whole league on bye and zero every lineup. */
    BYE = new Set();
    if(isWeek()){
      const playing = new Set();
      for(const id in proj){ const m = P[id]; if(m && m[2]) playing.add(m[2]); }
      if(playing.size >= 20){
        const all = new Set();
        for(const id in P) if(P[id][2]) all.add(P[id][2]);
        for(const t of all) if(!playing.has(t)) BYE.add(t);
      }
    }

    /* Ownership from the rosters endpoint in season, from the picks feed in the
       draft. Same shape either way, so everything downstream is untouched. */
    ROSTERED = new Set();
    if(isWeek()){
      taken = new Map();
      for(const r of (rosters || [])){
        const rid = asRid(r.roster_id);
        if(rid == null) continue;
        for(const pid of (r.players || [])){
          taken.set(String(pid), {rid, slot: null, seat: null, pick: null});
          ROSTERED.add(String(pid));
        }
      }
      MATCHUPS = new Map();
      const byMatch = {};
      for(const m of (matchups || [])){
        const rid = asRid(m.roster_id);
        if(rid == null || m.matchup_id == null) continue;
        (byMatch[m.matchup_id] = byMatch[m.matchup_id] || []).push(rid);
      }
      for(const [mid, rs] of Object.entries(byMatch))
        for(const rid of rs)
          MATCHUPS.set(rid, {matchup: +mid, opp: rs.find(x => x !== rid) ?? null});
    }

    if(dObj){
      draft.rounds = (dObj.settings && dObj.settings.rounds) || 45;
      draft.reversal = (dObj.settings && dObj.settings.reversal_round != null)
        ? dObj.settings.reversal_round : 3;
      draft.teams = (dObj.settings && dObj.settings.teams) || draft.teams;
      draft.slots = dObj.slot_to_roster_id || {};
      draft.season = dObj.season || league.season || null;
      const byId = {};
      for(const u of users) byId[u.user_id] = u.display_name || u.username || "";
      draft.names = {};
      draft.userRoster = {};
      for(const [uid, slot] of Object.entries(dObj.draft_order || {})){
        if(byId[uid]) draft.names[slot] = byId[uid];
        const rid = asRid(draft.slots[String(slot)]);
        if(rid != null) draft.userRoster[uid] = rid;
      }
    }
    /* Deduped on the whole row, so a deal both endpoints report is one hop, not
       two, and the chain walk does not bounce it back and forth. */
    const seenRow = new Set(), tp = [];
    for(const t of [].concat(tpDraft||[], tpLeague||[])){
      const k = [t.season, t.round, t.roster_id, t.previous_owner_id, t.owner_id].join("|");
      if(seenRow.has(k)) continue;
      seenRow.add(k); tp.push(t);
    }
    const {owner, slotOf} = buildOwners(draft, tp);
    draft.owner = owner; draft.slotOf = slotOf;
    const [picks, myRid] = myPicksFrom(draft, MY_SLOT);
    MY_PICKS = picks; MY_ROSTER_ID = myRid;
    /* slotOf only exists once buildOwners has run, so the roster-derived
       ownership gets its display slot here. Everything downstream, the league
       view included, keys on slot and so is untouched by which feed filled it. */
    if(isWeek()) for(const t of taken.values()) t.slot = slotOfRoster(t.rid) || t.slot;

    const rows = buildRows(P, proj, prior, SC, futureMultipliers(fcalc));
    const m = analyse(rows, slots, draft.teams);
    ROWS = rows;
    META = Object.assign({slots}, m);
    lastLoad = new Date();

    $("lg").textContent = `${league.name} · superflex · 2 PPR · TEP · ` +
      `${(slots.DL||0) + (slots.LB||0) + (slots.DB||0) + (slots.IDP_FLEX||0)} IDP starters · slot ${MY_SLOT}`;
    $("boot").hidden = true; $("app").hidden = false;
    renderStatic(); renderRoster(); render();

    /* Second opinion, after the board is already up so it never delays paint. */
    loadEspn().then(by => {
      let n = 0;
      for(const r of ROWS){
        const line = by[norm(r.n)];
        if(!line || !OFF.includes(r.p)) continue;
        const merged = Object.assign({}, line, firstDowns(line, prior[r.id] || {}, r.p));
        r.es = +score(merged, r.p, SC).toFixed(1); n++;
      }
      espnCount = n;
      if(n) render();
    }).catch(() => { espnCount = 0; });

    await poll();
  }catch(e){
    if(!ROWS.length){
      $("boot").hidden = false; $("boot").className = "msg bad";
      $("boot").textContent = "Couldn't load: " + e.message +
        ". Sleeper may be rate limiting — press Refresh in a minute.";
    }else{
      $("stalewarn").innerHTML =
        `<div class="warn">Refresh failed (${esc(e.message)}). Showing the board from ` +
        `${lastLoad ? lastLoad.toLocaleTimeString() : "the last successful pull"}.</div>`;
    }
  }finally{
    busy = false;
    btn.disabled = false; btn.textContent = "Refresh";
  }
}

/* ------------------------------------------------------------------ wiring */
$("hr").addEventListener("click", e => {
  const th = e.target.closest("th"); if(!th) return;
  const k = th.dataset.k;
  if(k === sortKey) sortDir = -sortDir;

  render();
});
const POS_GROUP = {ALL:[], OFF:OFF, IDP:DEF};
document.querySelectorAll("button[data-f]").forEach(btn => btn.onclick = ev => {
  const f = btn.dataset.f;
  if(f in POS_GROUP){
    /* Group buttons replace the selection outright, single positions toggle,
       so you can build RB + WR + TE or click Offence and be done. */
    pos = new Set(POS_GROUP[f]);
  }else if(ev.shiftKey || pos.size){
    pos.has(f) ? pos.delete(f) : pos.add(f);
  }else{
    pos = new Set([f]);
  }
  document.querySelectorAll("button[data-f]").forEach(o => {
    const k = o.dataset.f;
    const on = k in POS_GROUP
      ? (k === "ALL" ? pos.size === 0
         : POS_GROUP[k].length === pos.size && POS_GROUP[k].every(x => pos.has(x)))
      : pos.has(k);
    o.setAttribute("aria-pressed", on);
  });
  render();
});
["q","hide","yng"].forEach(i => $(i).addEventListener("input", render));
$("refresh").onclick = () => loadAll();

/* Header and filter bar are both sticky, so the headings must sit below the
   sum of their measured heights rather than a guessed constant. */
function stick(){
  const h = document.querySelector("header"), b = document.querySelector(".bar");
  if(h) document.documentElement.style.setProperty("--hdr", h.offsetHeight + "px");
  if(b && b.offsetHeight) document.documentElement.style.setProperty("--barh", b.offsetHeight + "px");
}
let rz = null;
addEventListener("resize", () => {
  stick();
  /* Column widths are computed, so crossing the phone breakpoint has to redraw
     them. Debounced, because a drag fires this continuously. */
  clearTimeout(rz);
  rz = setTimeout(() => { if(ROWS.length && META.R) render(); }, 150);
});

/* Console hook, for auditing the maths against the live board. */
window.IDP = {rows:() => ROWS, meta:() => META, fit, recommend, picks:() => MY_PICKS};

loadAll();
setInterval(poll, POLL_MS);
</script>
