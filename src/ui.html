<div class="boot" id="boot">Loading your roster…</div>

<div class="wrap" id="app" hidden>

  <header class="hdr narrow" id="app-header">
    <h2 class="sr-only">Header</h2>
    <div class="hdr-top">
      <div class="hdr-league">
        <span id="h-league">League</span>
        <span id="h-week">Week ?</span>
      </div>
      <div class="hdr-controls">
        <span class="feed"><span class="dot off" id="v-dot"></span><span id="v-feed">offline</span></span>
        <button type="button" id="btn-refresh">Refresh</button>
      </div>
    </div>
    <div class="hdr-matchup">
      <div class="hdr-team mine">
        <div class="t-name" id="h-me-name">You</div>
        <div class="t-total" id="h-me-total">0.0</div>
        <div class="t-set" id="h-me-set"></div>
      </div>
      <div class="hdr-vs">vs</div>
      <div class="hdr-team opp">
        <div class="t-name" id="h-opp-name">No matchup</div>
        <div class="t-total" id="h-opp-total">?</div>
      </div>
    </div>
    <div class="hdr-fetched" id="h-fetched"></div>
  </header>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Sections">
    <button type="button" class="tabbtn" id="tab-team" role="tab" aria-selected="true" aria-controls="view-team">My team</button>
    <button type="button" class="tabbtn" id="tab-matchup" role="tab" aria-selected="false" aria-controls="view-matchup">Matchup</button>
    <button type="button" class="tabbtn" id="tab-players" role="tab" aria-selected="false" aria-controls="sec-allplayers">Players</button>
    <button type="button" class="tabbtn" id="tab-league" role="tab" aria-selected="false" aria-controls="sec-league">League</button>
  </nav>

  <main>

    <!-- ============================================================ My team -->
    <section class="narrow" id="view-team" role="tabpanel" aria-labelledby="tab-team">
      <h2 class="view-h">My team</h2>

      <div class="filterbar" id="team-filterbar">
        <input type="search" class="team-search" id="team-search" placeholder="Search players" aria-label="Search players">
        <div class="posf" id="team-posfilter">
          <button type="button" data-pos="ALL" aria-pressed="true">ALL</button>
          <button type="button" data-pos="QB" aria-pressed="false">QB</button>
          <button type="button" data-pos="RB" aria-pressed="false">RB</button>
          <button type="button" data-pos="WR" aria-pressed="false">WR</button>
          <button type="button" data-pos="TE" aria-pressed="false">TE</button>
          <button type="button" data-pos="DL" aria-pressed="false">DL</button>
          <button type="button" data-pos="LB" aria-pressed="false">LB</button>
          <button type="button" data-pos="DB" aria-pressed="false">DB</button>
          <button type="button" data-pos="OFF" aria-pressed="false">OFF</button>
          <button type="button" data-pos="IDP" aria-pressed="false">IDP</button>
        </div>
        <span class="fb-count" id="team-count"></span>
      </div>

      <section id="sec-lineup">
        <h2 class="sec-h">Lineup</h2>
        <div id="team-lineup-rows"></div>
      </section>

      <section id="sec-startsit">
        <h2 class="sec-h">Start / sit</h2>
        <div id="team-startsit-body"></div>
      </section>

      <section id="sec-flagged">
        <h2 class="sec-h">Flagged</h2>
        <div id="team-flagged-body"></div>
      </section>

      <section id="sec-bench">
        <h2 class="sec-h">Bench</h2>
        <div id="team-bench-rows"></div>
      </section>

      <section id="sec-adds">
        <h2 class="sec-h">Adds</h2>
        <div id="team-adds-body"></div>
      </section>
    </section>

    <!-- ============================================================ Matchup -->
    <section id="view-matchup" role="tabpanel" aria-labelledby="tab-matchup" hidden>
      <h2 class="view-h">Matchup</h2>

      <div class="filterbar" id="matchup-filterbar">
        <input type="search" class="matchup-search" id="matchup-search" placeholder="Search players" aria-label="Search players">
        <div class="posf" id="matchup-posfilter">
          <button type="button" data-pos="ALL" aria-pressed="true">ALL</button>
          <button type="button" data-pos="QB" aria-pressed="false">QB</button>
          <button type="button" data-pos="RB" aria-pressed="false">RB</button>
          <button type="button" data-pos="WR" aria-pressed="false">WR</button>
          <button type="button" data-pos="TE" aria-pressed="false">TE</button>
          <button type="button" data-pos="DL" aria-pressed="false">DL</button>
          <button type="button" data-pos="LB" aria-pressed="false">LB</button>
          <button type="button" data-pos="DB" aria-pressed="false">DB</button>
          <button type="button" data-pos="OFF" aria-pressed="false">OFF</button>
          <button type="button" data-pos="IDP" aria-pressed="false">IDP</button>
        </div>
        <span class="fb-count" id="matchup-count"></span>
      </div>

      <div class="matchup-controls">
        <select id="matchup-opp" aria-label="Opponent"></select>
        <div class="modef" id="matchup-mode">
          <button type="button" data-mode="optimal" aria-pressed="true">Optimal</button>
          <button type="button" data-mode="set" aria-pressed="false">As set</button>
        </div>
      </div>

      <div class="msg" id="matchup-nomatch" hidden>No matchup this week. Pick a team above to compare.</div>

      <div id="matchup-body">
        <div class="mtotals" id="matchup-totals"></div>
        <div id="matchup-rows"></div>

        <h3 class="sec-h">Summary</h3>
        <div class="scroll">
          <table class="msummary">
            <colgroup><col><col class="num"><col class="num"><col class="num"></colgroup>
            <thead><tr><th class="l">Group</th><th>You</th><th>Them</th><th>Diff</th></tr></thead>
            <tbody id="matchup-summary-body"></tbody>
          </table>
        </div>

        <h3 class="sec-h">Their flagged</h3>
        <div id="matchup-oppflagged-body"></div>
      </div>
    </section>

    <!-- ============================================================ Players
         Container id kept as the pre-tab build's "sec-allplayers" (rather
         than view-players, matching the other three) since test/page_smoke.mjs,
         which this rework does not touch, still scrolls to it by that id. -->
    <section id="sec-allplayers" role="tabpanel" aria-labelledby="tab-players" hidden>
      <h2 class="view-h">Players</h2>

      <div class="filterbar" id="players-filterbar">
        <input type="search" class="players-search" id="players-search" placeholder="Search players" aria-label="Search players">
        <div class="posf" id="players-posfilter">
          <button type="button" data-pos="ALL" aria-pressed="true">ALL</button>
          <button type="button" data-pos="QB" aria-pressed="false">QB</button>
          <button type="button" data-pos="RB" aria-pressed="false">RB</button>
          <button type="button" data-pos="WR" aria-pressed="false">WR</button>
          <button type="button" data-pos="TE" aria-pressed="false">TE</button>
          <button type="button" data-pos="DL" aria-pressed="false">DL</button>
          <button type="button" data-pos="LB" aria-pressed="false">LB</button>
          <button type="button" data-pos="DB" aria-pressed="false">DB</button>
          <button type="button" data-pos="OFF" aria-pressed="false">OFF</button>
          <button type="button" data-pos="IDP" aria-pressed="false">IDP</button>
        </div>
        <span class="fb-count" id="players-count"></span>
      </div>

      <div class="players-extra">
        <select id="players-owner" aria-label="Owner"></select>
        <label class="hide-c"><input type="checkbox" id="players-flagged-only"> Flagged only</label>
        <select id="players-sort" aria-label="Sort by">
          <option value="our">Our projection</option>
          <option value="sleeper">Sleeper</option>
          <option value="hidden">Hidden</option>
          <option value="vorp">VORP rank</option>
          <option value="age">Age</option>
        </select>
      </div>

      <div class="scroll" id="players-list"></div>
      <button type="button" id="players-showall" hidden>Show all</button>
    </section>

    <!-- ============================================================ League
         Container id kept as "sec-league" for the same reason as Players,
         above. -->
    <section id="sec-league" role="tabpanel" aria-labelledby="tab-league" hidden>
      <h2 class="view-h">League</h2>

      <div class="filterbar" id="league-controls">
        <input type="search" id="league-search" placeholder="Search teams" aria-label="Search teams">
      </div>

      <div class="scroll">
        <table class="league" id="league-table">
          <colgroup><col><col><col class="num"><col class="num"><col class="num"><col class="num"></colgroup>
          <thead>
            <tr id="league-thead-row"></tr>
          </thead>
          <tbody id="league-body"></tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<div id="cardwrap" hidden>
  <div id="cardbg"></div>
  <div id="card" role="dialog" aria-modal="true" aria-labelledby="card-name">
    <button type="button" id="cardclose" aria-label="Close">&times;</button>
    <h2 class="card-eyebrow">Player card</h2>
    <div id="card-body"></div>
  </div>
</div>
